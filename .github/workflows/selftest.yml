# Self-test: prove the installer + template produce a working, gate-green
# Next + Expo + Supabase monorepo on every change. This matrix IS the release
# acceptance test; the DB-backed lanes (bootstrap-linux, integration,
# maestro-smoke) drive the Supabase local stack via its own CLI (`supabase
# start` — Postgres + auth + GoTrue), never a bare postgres service container,
# and no job in this matrix may ever require EAS, Apple, or Google credentials.
name: selftest

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Nightly: the emulator lane (maestro-smoke) is schedule/dispatch-only — too
    # expensive per-PR — and the nightly keeps every other job honest between pushes.
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Both unit lanes run on ubuntu AND windows: the path-separator/CRLF/shell
  # bug class only reproduces on a real Windows filesystem — a Linux-only unit
  # lane cannot make that class extinct.
  installer-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        # harden-runner egress blocking is unsupported on Windows (audit-only);
        # declaring audit everywhere keeps the two legs honest and identical.
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: node scripts/check-syntax.mjs
      - run: node scripts/hygiene.mjs
      # Release lockstep on every PR: version skew between package.json, the
      # plugin manifest, the hook stamps, CITATION.cff, and the CHANGELOG must
      # red the PR that introduces it, not the eventual tag build.
      - run: node scripts/check-release-lockstep.mjs
      # Plugin manifests + the shipped agent roster, validated at their SOURCE:
      # plugin.json/marketplace.json reference only files that exist (dangling
      # paths are dead on install), and every reviewer agent stays read-only by
      # construction (tools ⊆ allowlist, disallowedTools ⊇ Write/Edit) — a PR
      # that widens a reviewer reds here before any scaffold runs docs-sync.
      - run: node scripts/check-plugin-manifest.mjs
      # Gate↔canary lockstep (mirrors the source harness's placement): every
      # VALIDATE ∪ STOP step carries a registered red-proof, every proof file
      # runs green with real tests (the zero-test TAP detection is
      # format-independent — resolved paths, never rendered text — so the
      # Windows leg judges the same signal), and every guard rule id has a
      # behavioral canary in tests/hooks/hook-contract.test.mjs.
      - run: node scripts/check-canary-coverage.mjs
      # Coverage floor over the installer itself. Measured 91.6/80.2/95.2 with
      # the W5b test set (lifecycle/graduate restored); floors sit ~6 points
      # under, raised from the W1 78/70/90 — floors only ever rise.
      - run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='installer/**'
          --test-coverage-lines=85 --test-coverage-branches=74 --test-coverage-functions=91
          "tests/**/*.test.mjs"
      # Second floor over the TEMPLATE gate-support libs (template/base/tools/lib/**),
      # measured 94.5/89.0/84.6 at W5b over the gate-logic tests; floors sit ~6
      # points under. The gate SCRIPTS themselves (tools/check-*.mjs) run as
      # CHILD processes and are covered BEHAVIORALLY by the canary red-proof
      # closure (scripts/check-canary-coverage.mjs), not by line coverage — a
      # gate that cannot go red is decoration, which line counting cannot catch.
      - run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='template/base/tools/lib/**'
          --test-coverage-lines=88 --test-coverage-branches=82 --test-coverage-functions=78
          "tests/gates/*.test.mjs"

  # A rendered scaffold carries no unrendered {{PLACEHOLDER}} and no
  # cross-stack residue — proven on a real init into a scratch dir.
  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: init --yes into a scratch dir
        run: node installer/cli.mjs init --dir "$RUNNER_TEMP/scaffold" --tier core --yes
      - name: zero unrendered placeholders
        run: node scripts/check-residue.mjs "$RUNNER_TEMP/scaffold"
      - name: rendered tree passes the syntax scan
        run: node scripts/check-syntax.mjs "$RUNNER_TEMP/scaffold"
      - name: init METAL --yes into a second scratch dir
        run: node installer/cli.mjs init --dir "$RUNNER_TEMP/scaffold-metal" --tier core --yes --set DESIGN_TOKENS=metal
      - name: metal scaffold carries zero unrendered placeholders
        run: node scripts/check-residue.mjs "$RUNNER_TEMP/scaffold-metal"
      - name: metal scaffold passes the syntax scan
        run: node scripts/check-syntax.mjs "$RUNNER_TEMP/scaffold-metal"

  # One deliberate violation per gate DIRECTION; each must turn the matching
  # gate red on an otherwise-green scaffold. Baseline-pass first so a failure is
  # attributable to the injection, not to a broken fixture. Ubuntu only, no
  # emulator, and no EAS/Apple/Google credentials — the config-resolving gates
  # (expo-policy, native-deps, e2e, build) only need the installed expo CLI.
  # The W6 device lanes carry their own wall-clock canaries when they land
  # (see tests/canary/injections.json PORT NOTE).
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Scaffold canary fixture (committed git baseline for the diff-based gates)
        run: |
          node installer/cli.mjs init --dir "$RUNNER_TEMP/canary" --tier core --yes
          cd "$RUNNER_TEMP/canary"
          git init -q -b main
          git add -A
          git -c user.email=selftest@localhost -c user.name=selftest commit -qm 'scaffold baseline'
      - name: Install the scaffold (config resolution + jest + export need real deps)
        working-directory: ${{ runner.temp }}/canary
        run: |
          corepack enable
          corepack prepare --activate
          pnpm install --no-frozen-lockfile
      - name: RLS runner FAILS CLOSED without a database (CI=true)
        working-directory: ${{ runner.temp }}/canary
        run: |
          if CI=true node tests/rls/run-rls.mjs; then
            echo '::error::CANARY: the RLS runner exited 0 with no database reachable — a skip is reading as a pass'; exit 1
          fi
          echo 'canary OK: rls runner fails closed without a database'
      - name: Baseline — every canaried gate PASSES on the clean scaffold
        working-directory: ${{ runner.temp }}/canary
        run: |
          # GITHUB_BASE_REF belongs to the harness checkout, not this scaffold
          # repo — unset it so the diff-based gates diff against the scaffold's
          # own HEAD instead of a ref that does not exist here.
          env -u GITHUB_BASE_REF node tools/check-expo-policy.mjs
          env -u GITHUB_BASE_REF node tools/check-native-deps.mjs
          env -u GITHUB_BASE_REF node tools/check-migrations.mjs
          env -u GITHUB_BASE_REF node tools/check-sources.mjs
          env -u GITHUB_BASE_REF node tools/check-rls-manifest.mjs
          env -u GITHUB_BASE_REF node tools/check-gate-integrity.mjs
          env -u GITHUB_BASE_REF node tools/check-prompts-lock.mjs
          env -u GITHUB_BASE_REF node tools/check-styleguide-manifest.mjs
          env -u GITHUB_BASE_REF node tools/check-route-manifest.mjs
          env -u GITHUB_BASE_REF node tools/check-mobile-perf.mjs --closure
          env -u GITHUB_BASE_REF node tools/check-docs-sync.mjs
          env -u GITHUB_BASE_REF node tools/check-duplication.mjs
          env -u GITHUB_BASE_REF node tools/check-test-quality.mjs
          env -u GITHUB_BASE_REF node tools/check-i18n.mjs
          env -u GITHUB_BASE_REF node tools/check-e2e.mjs
          env -u GITHUB_BASE_REF node tools/build-check.mjs
      - name: 'Canary 1: NSAllowsArbitraryLoads + undeclared permission + secret-shaped extra → expo-policy must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          node -e '
            const fs = require("node:fs")
            const f = "apps/mobile/app.config.ts"
            let s = fs.readFileSync(f, "utf8")
            // Inject INTO the shipped infoPlist block (0.1.2 ships one for the
            // export-compliance declaration) — a second infoPlist key would be
            // shadowed by the later duplicate and the ATS hole would never
            // reach the resolved config.
            s = s.replace("ITSAppUsesNonExemptEncryption: false,", "ITSAppUsesNonExemptEncryption: false,\n        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true },")
            s = s.replace("adaptiveIcon: {", "permissions: [\"android.permission.CAMERA\"],\n      adaptiveIcon: {")
            s = s.replace("extra: {", "extra: {\n      canaryApiKey: \"shipped-in-bundle\",")
            fs.writeFileSync(f, s)
          '
          if env -u GITHUB_BASE_REF node tools/check-expo-policy.mjs > canary1.log 2>&1; then
            cat canary1.log
            echo '::error::CANARY: expo-policy PASSED an ATS hole + unreviewed permission + secret-shaped extra — the gate cannot fail'; exit 1
          fi
          # A bare `grep -q` under set -e swallows all evidence when the gate
          # reds via the WRONG path — always dump the log before asserting why.
          for leg in 'NSAllowsArbitraryLoads' 'no reviewed reason' 'secret-shaped key'; do
            if ! grep -q "$leg" canary1.log; then
              cat canary1.log
              echo "::error::CANARY: expo-policy reddened WITHOUT the '$leg' message — wrong failure path (log above)"; exit 1
            fi
          done
          git checkout -q -- apps/mobile/app.config.ts
          echo 'canary OK: expo-policy went red on all three legs'
      - name: 'Canary 2: stage the generated android/ dir → native-deps must FAIL (CNG purity)'
        working-directory: ${{ runner.temp }}/canary
        run: |
          mkdir -p apps/mobile/android
          echo '// prebuild output' > apps/mobile/android/build.gradle
          git add -f apps/mobile/android
          if env -u GITHUB_BASE_REF node tools/check-native-deps.mjs; then
            echo '::error::CANARY: native-deps PASSED a committed native dir — CNG purity cannot fail'; exit 1
          fi
          git rm -qr --cached apps/mobile/android
          rm -rf apps/mobile/android
          echo 'canary OK: native-deps went red'
      - name: 'Canary 3: edit a committed migration → migrations must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          echo 'ALTER TABLE public.notes ADD COLUMN sneaky text;' >> supabase/migrations/20260101000100_notes.sql
          if env -u GITHUB_BASE_REF node tools/check-migrations.mjs; then
            echo '::error::CANARY: migrations PASSED after editing a committed migration — the gate cannot fail'; exit 1
          fi
          git checkout -q -- .
          echo 'canary OK: migrations went red'
      - name: 'Canary 4: strip SOURCE citations from decision sites → provenance must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          sed -i '/SOURCE:/d' supabase/migrations/20260101000100_notes.sql
          if env -u GITHUB_BASE_REF node tools/check-sources.mjs; then
            echo '::error::CANARY: provenance PASSED with uncited decision sites — the gate cannot fail'; exit 1
          fi
          git checkout -q -- .
          echo 'canary OK: provenance went red'
      - name: 'Canary 5: remove FORCE RLS from the migration → schema-rls must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          sed -i '/FORCE ROW LEVEL SECURITY/d' supabase/migrations/20260101000100_notes.sql
          if env -u GITHUB_BASE_REF node tools/check-rls-manifest.mjs; then
            echo '::error::CANARY: schema-rls PASSED without FORCE RLS — the gate cannot fail'; exit 1
          fi
          git checkout -q -- .
          echo 'canary OK: schema-rls went red'
      - name: 'Canary 6: tamper a gate script on disk → gate-integrity must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          echo '// tampered by the selftest canary' >> tools/check-migrations.mjs
          if env -u GITHUB_BASE_REF node tools/check-gate-integrity.mjs; then
            echo '::error::CANARY: gate-integrity PASSED a tampered gate script — the manifest hash surface cannot fail'; exit 1
          fi
          git checkout -q -- tools/check-migrations.mjs
          echo 'canary OK: gate-integrity went red'
      - name: 'Canary 7: tamper a hash-locked prompt → prompts must FAIL'
        working-directory: ${{ runner.temp }}/canary
        # The base scaffold ships ZERO prompts (they arrive with the eval-live module),
        # so this canary SEEDS one and locks it before tampering. That is stronger than
        # the previous form, which appended to a path that does not exist here: the file
        # was created rather than modified, nothing was in the lock, and the gate stayed
        # green — a canary that could never have caught a regression. Seeding also gives
        # the proof a positive control: the gate must go GREEN on the locked prompt
        # first, or "it went red" would say nothing.
        run: |
          set -euo pipefail
          mkdir -p packages/contracts/prompts
          printf 'Extract the fields named in the schema. Return JSON only.\n' \
            > packages/contracts/prompts/extract.v1.md
          node -e '
            const { createHash } = require("node:crypto")
            const { readFileSync, writeFileSync } = require("node:fs")
            const p = "packages/contracts/prompts/extract.v1.md"
            const sha = createHash("sha256").update(readFileSync(p)).digest("hex")
            writeFileSync("tools/prompts.lock.json", JSON.stringify({ [p]: sha }, null, 2) + "\n")
          '
          if ! env -u GITHUB_BASE_REF node tools/check-prompts-lock.mjs; then
            echo '::error::CANARY SETUP: prompts red on a correctly locked prompt — the positive control failed'; exit 1
          fi
          echo ' ' >> packages/contracts/prompts/extract.v1.md
          if env -u GITHUB_BASE_REF node tools/check-prompts-lock.mjs; then
            echo '::error::CANARY: prompts PASSED a tampered hash-locked prompt — the gate cannot fail'; exit 1
          fi
          git checkout -q -- .
          rm -rf packages/contracts/prompts
          echo 'canary OK: prompts green when locked, red when tampered'
      - name: 'Canary 8: raw hex + inline-style literals in a screen → styleguide must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          printf 'import { View } from "react-native"\nexport const Oops = () => <View style={{ padding: 17, backgroundColor: "#ff0000" }} />\n' > apps/mobile/src/oops.tsx
          if env -u GITHUB_BASE_REF node tools/check-styleguide-manifest.mjs > canary8.log 2>&1; then
            cat canary8.log
            echo '::error::CANARY: styleguide PASSED raw hex + an inline style object — the gate cannot fail'; exit 1
          fi
          if ! grep -q '#ff0000' canary8.log; then
            cat canary8.log
            echo '::error::CANARY: styleguide reddened WITHOUT naming the raw hex — wrong failure path (log above)'; exit 1
          fi
          rm apps/mobile/src/oops.tsx
          echo 'canary OK: styleguide went red on both legs'
      - name: 'Canary 9: an orphan app/ route file + an unregistered screen → route-manifest must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          printf 'export default function Rogue() {\n  return null\n}\n' > apps/mobile/app/rogue.tsx
          printf 'export default function Reports() {\n  return null\n}\n' > 'apps/mobile/app/(tabs)/reports.tsx'
          if env -u GITHUB_BASE_REF node tools/check-route-manifest.mjs; then
            echo '::error::CANARY: route-manifest PASSED unclaimed route files — the closure cannot fail'; exit 1
          fi
          rm apps/mobile/app/rogue.tsx 'apps/mobile/app/(tabs)/reports.tsx'
          echo 'canary OK: route-manifest went red'
      - name: 'Canary 10: a route with no Maestro flow / no startup-budget row → the mobile-perf closure must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          rm maestro/flows/actions.yaml
          if env -u GITHUB_BASE_REF node tools/check-mobile-perf.mjs --closure; then
            echo '::error::CANARY: mobile-perf --closure PASSED a route with no Maestro flow — the closure cannot fail'; exit 1
          fi
          git checkout -q -- maestro/flows/actions.yaml
          node -e '
            const fs = require("node:fs")
            const f = "tools/startup-budget.json"
            const j = JSON.parse(fs.readFileSync(f, "utf8"))
            delete j.screens.actions
            fs.writeFileSync(f, JSON.stringify(j, null, 2))
          '
          if env -u GITHUB_BASE_REF node tools/check-mobile-perf.mjs --closure; then
            echo '::error::CANARY: mobile-perf --closure PASSED a route with no startup-budget row — the closure cannot fail'; exit 1
          fi
          git checkout -q -- tools/startup-budget.json
          echo 'canary OK: mobile-perf closure went red on both legs'
      - name: 'Canary 11: a zero-test jest run → the e2e gate must FAIL (anti-vacuity)'
        working-directory: ${{ runner.temp }}/canary
        run: |
          cat >> apps/mobile/jest.config.js <<'EOF'
          module.exports.testMatch = ['<rootDir>/__no_tests_here__/*.test.js']
          module.exports.passWithNoTests = true
          EOF
          if env -u GITHUB_BASE_REF node tools/check-e2e.mjs > canary11.log 2>&1; then
            cat canary11.log
            echo '::error::CANARY: the e2e gate PASSED a jest run that ran nothing — the anti-vacuity check cannot fail'; exit 1
          fi
          if ! grep -q 'vacuous' canary11.log; then
            cat canary11.log
            echo '::error::CANARY: the e2e gate reddened WITHOUT the vacuous-pass message — wrong failure path (log above)'; exit 1
          fi
          git checkout -q -- apps/mobile/jest.config.js
          echo 'canary OK: e2e went red on a vacuous run'
      - name: 'Canary 12: a tiny committed perf-baseline → the build gzip ratchet must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          node -e '
            const fs = require("node:fs")
            fs.writeFileSync("tools/perf-baseline.json", JSON.stringify({ gzip: { total: 1000 }, ratioCap: 1.25 }, null, 2))
          '
          if env -u GITHUB_BASE_REF node tools/build-check.mjs > canary12.log 2>&1; then
            cat canary12.log
            echo '::error::CANARY: build PASSED a bundle far over baseline × ratioCap — the ratchet cannot fail'; exit 1
          fi
          if ! grep -q 'exceeds the committed ratchet' canary12.log; then
            cat canary12.log
            echo '::error::CANARY: build reddened WITHOUT the ratchet message — wrong failure path (log above)'; exit 1
          fi
          git checkout -q -- tools/perf-baseline.json
          echo 'canary OK: the build ratchet went red'
      - name: 'Canary 13: remove a numbered gates-catalog section → docs-sync must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          # The heading NUMBER is deliberately not pinned. docs-sync is the last gate,
          # and the chain grows: a number-pinned sed silently deletes nothing once the
          # chain changes length, the gate then correctly stays green, and the canary
          # blames the gate for a tamper that never landed. (That is exactly what a
          # stale `### 21.` did here — the chain is 24 steps in this lineage.) Assert
          # the injection changed the file BEFORE reading anything into the gate's verdict.
          before=$(git hash-object docs/harness/gates-catalog.md)
          # BRE `[0-9][0-9]*`, not ERE `[0-9]+`: identical under GNU and BSD sed, so the
          # same injection can be rehearsed locally before it is trusted in CI.
          sed -i '/^### [0-9][0-9]*\. docs-sync — /d' docs/harness/gates-catalog.md
          if [ "$(git hash-object docs/harness/gates-catalog.md)" = "$before" ]; then
            echo '::error::CANARY SETUP: the docs-sync catalog heading was never removed — the injection is stale, not the gate'; exit 1
          fi
          if env -u GITHUB_BASE_REF node tools/check-docs-sync.mjs; then
            echo '::error::CANARY: docs-sync PASSED with a gate missing from the catalog — the lockstep cannot fail'; exit 1
          fi
          git checkout -q -- docs/harness/gates-catalog.md
          echo 'canary OK: docs-sync went red'
      - name: 'Canary 14: a pasted token clone across two modules → duplication must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          clone() {
            printf 'export function canaryCloneScore(rows: number[]): number {\n'
            printf '  let total = 0\n'
            printf '  let positives = 0\n'
            printf '  let negatives = 0\n'
            printf '  for (const row of rows) {\n'
            printf '    if (row > 0) {\n'
            printf '      total += row * 2\n'
            printf '      positives += 1\n'
            printf '    } else {\n'
            printf '      total -= row * 3\n'
            printf '      negatives += 1\n'
            printf '    }\n'
            printf '  }\n'
            printf '  const mean = total / Math.max(rows.length, 1)\n'
            printf '  const spread = Math.max(...rows) - Math.min(...rows)\n'
            printf '  return mean + spread + total + positives - negatives\n'
            printf '}\n'
          }
          clone > apps/mobile/src/features/notes/canaryClone.ts
          clone > apps/mobile/src/features/matrix/canaryClone.ts
          if env -u GITHUB_BASE_REF node tools/check-duplication.mjs; then
            echo '::error::CANARY: duplication PASSED an identical 18-line paste across two modules — the clone scan cannot fail'; exit 1
          fi
          rm apps/mobile/src/features/notes/canaryClone.ts apps/mobile/src/features/matrix/canaryClone.ts
          echo 'canary OK: duplication went red'
      - name: 'Canary 15: a committed .only → test-quality must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          printf 'import { describe, it, expect } from "vitest"\n\ndescribe("canary", () => {\n  it.only("focuses the run", () => {\n    expect(1).toBe(1)\n  })\n})\n' > packages/api/src/canary-focus.test.ts
          if env -u GITHUB_BASE_REF node tools/check-test-quality.mjs; then
            echo '::error::CANARY: test-quality PASSED a committed .only — the focused-test check cannot fail'; exit 1
          fi
          rm packages/api/src/canary-focus.test.ts
          echo 'canary OK: test-quality went red'
      - name: 'Canary 16: a hardcoded user-facing string → the static i18n gate must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          printf 'import { AppText } from "../components/AppText"\n\nexport const Oops = () => <AppText>Hardcoded canary copy</AppText>\n' > apps/mobile/src/oops-i18n.tsx
          if env -u GITHUB_BASE_REF node tools/check-i18n.mjs; then
            echo '::error::CANARY: i18n PASSED a hardcoded user-facing string — the static scan cannot fail'; exit 1
          fi
          rm apps/mobile/src/oops-i18n.tsx
          echo 'canary OK: the static i18n gate went red'
      - name: 'Canary 21: delete a CSP directive → security-headers must FAIL'
        working-directory: ${{ runner.temp }}/canary
        run: |
          sed -i "/frame-ancestors 'none'/d" apps/web/lib/security-headers.ts
          if env -u GITHUB_BASE_REF node tools/check-security-headers.mjs; then
            echo '::error::CANARY: security-headers PASSED a CSP with no frame-ancestors — the value check cannot fail'; exit 1
          fi
          git checkout -q -- apps/web/lib/security-headers.ts
          echo 'canary OK: security-headers went red'
      - name: 'Canary 22: RLS turned OFF by a later migration → schema-rls must FAIL'
        working-directory: ${{ runner.temp }}/canary
        # The 0.1.3 gate collected ENABLE and FORCE and matched no negation, so this
        # exact statement left `notes` in the enabled set and the gate reported the
        # table fully covered. Unramped, because no legitimate install disables RLS.
        run: |
          printf 'ALTER TABLE public.notes DISABLE ROW LEVEL SECURITY;\n' > supabase/migrations/29990101000000_canary_disable_rls.sql
          if env -u GITHUB_BASE_REF node tools/check-rls-manifest.mjs; then
            echo '::error::CANARY: schema-rls PASSED a migration that DISABLES row level security — the negation set cannot fail'; exit 1
          fi
          rm supabase/migrations/29990101000000_canary_disable_rls.sql
          echo 'canary OK: schema-rls went red on the negation'
      - name: 'Canary 25: unwire a hook + flip the permission posture → wiring must FAIL'
        working-directory: ${{ runner.temp }}/canary
        # BOTH halves in one leg, because both were states a 0.2.1 install could be in
        # while every hash matched and the whole chain was green. The MCP guard is the
        # sharp one: before it existed, `mcp__` tool calls matched NO PreToolUse hook at
        # all while docs/security/approved-tools.md declared default-deny.
        run: |
          node -e '
            const fs = require("node:fs")
            const s = JSON.parse(fs.readFileSync(".claude/settings.json", "utf8"))
            s.hooks.PreToolUse = s.hooks.PreToolUse.filter((g) => !JSON.stringify(g).includes("pretool-mcp-guard"))
            s.permissions.defaultMode = "bypassPermissions"
            fs.writeFileSync(".claude/settings.json", JSON.stringify(s, null, 2) + "\n")
          '
          if env -u GITHUB_BASE_REF node tools/check-wiring.mjs; then
            echo '::error::CANARY: wiring PASSED an install with the MCP guard unwired and bypassPermissions as the default mode'; exit 1
          fi
          git checkout -q -- .claude/settings.json
          echo 'canary OK: wiring went red on the unwired hook and the posture'
      - name: 'Canary 26: an sb_secret_ key in a tracked file → secrets must FAIL'
        working-directory: ${{ runner.temp }}/canary
        # lefthook prints `SKIP secrets scan` without the gitleaks binary and gitleaks.yml
        # only runs after a PUSH — so before 0.3.0 this exact file could sit in a tree
        # through a green turn on any machine without gitleaks.
        run: |
          printf "export const k = 'sb_secret_9f2a1c4b7e0d3856aa11bb22'\n" > apps/web/lib/canary-leak.ts
          if env -u GITHUB_BASE_REF node tools/check-secrets.mjs; then
            echo '::error::CANARY: secrets PASSED a service-role key in a tracked file'; exit 1
          fi
          rm apps/web/lib/canary-leak.ts
          echo 'canary OK: secrets went red on the service-role key'
      - name: Restore sanity — gates green again after the last restore
        working-directory: ${{ runner.temp }}/canary
        run: |
          env -u GITHUB_BASE_REF node tools/check-rls-manifest.mjs
          env -u GITHUB_BASE_REF node tools/check-route-manifest.mjs
          env -u GITHUB_BASE_REF node tools/check-i18n.mjs
          env -u GITHUB_BASE_REF node tools/check-security-headers.mjs
          env -u GITHUB_BASE_REF node tools/check-wiring.mjs
          env -u GITHUB_BASE_REF node tools/check-secrets.mjs

  canary-mutation:
    name: 'canary-mutation: an untested branch must red the mutation lane — and nothing else'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Bootstrap a fresh project
        run: node installer/cli.mjs init --dir "$GITHUB_WORKSPACE/.selftest/mut" --tier core --yes
      - name: Install
        working-directory: .selftest/mut
        run: |
          corepack enable
          corepack prepare --activate
          pnpm install --no-frozen-lockfile

      # Baseline: the shipped exemplar must be green before we can claim an injection reds it.
      - name: 'Baseline: the shipped critical surface is within its committed baseline'
        working-directory: .selftest/mut
        run: |
          pnpm exec stryker run stryker.config.mjs
          node tools/check-mutation-ratchet.mjs

      - name: 'Canary: add ONE untested branch to a well-covered file → the mutation lane must FAIL while every other gate stays GREEN'
        working-directory: .selftest/mut
        run: |
          # Git baseline so the diff-scoped gates below (diff-coverage, test-quality) judge
          # EXACTLY the one file this canary injects — not every untracked scaffold file.
          git init -q -b main
          git add -A
          git -c user.email=selftest@localhost -c user.name=selftest commit -qm 'scaffold baseline'
          # Add ONE untested branch to the version-skew floor: an optional patch-grace
          # tolerance defaulted from an env var no test sets. Every existing caller omits
          # the 3rd arg and the env is unset, so the default is 0 and behaviour is
          # byte-identical — vitest/diff-coverage/test-quality stay green — but the
          # `- patchGrace` arm is executed-yet-unasserted, so Stryker's arithmetic mutant
          # (`- patchGrace` → `+ patchGrace`) survives at grace 0. This is the Supabase-era
          # analog of the retired verify.ts AUTH_CLOCK_SKEW/clockTolerance canary.
          python3 - <<'PY'
          p = 'packages/api/src/skew.ts'
          s = open(p).read()
          s = s.replace(
              "export function isBelowMinimum(clientVersion: string, minSupported: string | null): boolean {",
              "export function isBelowMinimum(\n  clientVersion: string,\n  minSupported: string | null,\n  patchGrace: number = Number(process.env.MIN_CLIENT_PATCH_GRACE ?? 0),\n): boolean {", 1)
          s = s.replace("  return cPatch < mPatch", "  return cPatch < mPatch - patchGrace", 1)
          open(p, 'w').write(s)
          PY
          grep -q 'MIN_CLIENT_PATCH_GRACE' packages/api/src/skew.ts \
            || { echo '::error::the canary injection did not apply — the source moved; fix the patch, do not delete the canary'; exit 1; }

          # (1) Every OTHER control must stay green — otherwise this proves nothing about
          #     what mutation testing uniquely adds over them. Both coverage maps are
          #     written first: diff-coverage merges the vitest and jest-expo maps.
          pnpm exec vitest run --coverage --silent \
            || { echo '::error::MUTATION CANARY: the unit suite reddened. The injection must be executed-but-unverified, not broken'; exit 1; }
          pnpm --filter mobile exec jest --coverage --silent \
            || { echo '::error::MUTATION CANARY: the mobile unit suite reddened; the injection touches only packages/api'; exit 1; }
          # env -u GITHUB_BASE_REF: the diff-scoped gates read GITHUB_BASE_REF, which belongs
          # to the harness checkout, not this scaffold's git repo.
          env -u GITHUB_BASE_REF node tools/check-diff-coverage.mjs \
            || { echo '::error::MUTATION CANARY: diff-coverage reddened; the injection was supposed to slip THROUGH the per-file floors'; exit 1; }
          env -u GITHUB_BASE_REF node tools/check-test-quality.mjs \
            || { echo '::error::MUTATION CANARY: test-quality reddened; the injection adds no test, it does not remove an assertion'; exit 1; }

          # (2) …and the mutation lane must catch what all of them missed.
          rm -rf reports/mutation .stryker-tmp
          pnpm exec stryker run stryker.config.mjs --mutate packages/api/src/skew.ts
          if node tools/check-mutation-ratchet.mjs > ratchet.log 2>&1; then
            cat ratchet.log
            echo '::error::MUTATION CANARY: an untested branch survived the ratchet. The lane cannot fail, so it is decoration — coverage already told us this code RAN; only mutation can tell us no test would NOTICE it breaking'
            exit 1
          fi
          grep -q 'new surviving mutant' ratchet.log \
            || { cat ratchet.log; echo '::error::the ratchet failed for the WRONG reason (not a new survivor)'; exit 1; }
          grep -E 'MIN_CLIENT_PATCH_GRACE|new surviving mutant|change:' ratchet.log | head -n 8
          git checkout -q -- packages/api/src/skew.ts
          echo 'canary OK: unit + diff-coverage + test-quality all stayed GREEN; only the mutation ratchet caught it'

  # ---------------------------------------------------------------------------
  # The product promise on Linux: a fresh scaffold is validate-green OUT OF THE
  # BOX with real toolchains required, the warm agent-time experience stays
  # inside its wall-time budget (with the e2e stamp positive control — the
  # biggest warm win must be SEEN engaging, not assumed), and the RLS story is
  # proven in BOTH directions against the scaffold's own pinned database:
  # fail-closed with no db, green with one, and RED again when the keyset index
  # is dropped (Canary 17 — the DAL plan probe seeing the whole-partition Sort).
  # Canary 18 proves the prebuild-determinism compare can fail: a config plugin
  # emitting run-dependent output MUST break the double-prebuild tree hash the
  # consumer native lane relies on.
  # ---------------------------------------------------------------------------
  bootstrap-linux:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Bootstrap a fresh project from the template
        run: node installer/cli.mjs init --dir "$GITHUB_WORKSPACE/.selftest/boot" --tier core --yes
      - name: Git baseline + corepack (lefthook prepare and the diff-based gates need a repo)
        working-directory: .selftest/boot
        run: |
          git init -q -b main
          git add -A
          git -c user.email=selftest@localhost -c user.name=selftest commit -qm 'scaffold baseline'
          corepack enable
          corepack prepare --activate
      # Resolving the store path is the cache CONFIG step: if it fails, the job
      # hard-fails here (cache config error), never silently uncached.
      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: .selftest/boot
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('template/base/pnpm-workspace.yaml', 'template/**/package.json.tmpl') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node${{ matrix.node }}-
      - name: pnpm install
        working-directory: .selftest/boot
        run: pnpm install --no-frozen-lockfile
      # The Supabase CLI ships as a CATALOG-PINNED devDependency of the scaffold, so
      # it lives at node_modules/.bin — which a `run:` step's PATH does not include
      # (only package-manager script execution adds it). Put it on PATH once, rather
      # than prefixing each call site with `pnpm exec`: tests/rls/run-rls.mjs spawns
      # `supabase` as a BARE command from inside node (execFileSync), so an outer
      # prefix would not reach it. A setup-cli action is deliberately not used — it
      # would float a second, un-catalogued CLI version past the one-version catalog.
      - name: Put the workspace-local Supabase CLI on PATH
        working-directory: .selftest/boot
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      # Soft assertion: on a re-run with an unchanged catalog the store cache
      # should hit. A miss is a warning (first run / catalog bump are
      # legitimate); a cache CONFIG error already failed the job above.
      - name: Assert pnpm store cache effectiveness
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: echo "::warning title=pnpm store cache miss::⚠ pnpm store cache missed (key pnpm-store-${RUNNER_OS}-node${NODE_MAJOR}-…). Expected on the first run after a catalog change; investigate if this repeats on unchanged re-runs."
        env:
          NODE_MAJOR: ${{ matrix.node }}
      - name: THE GATE — full validate must be green out of the box (CI floor, expo resolution for real)
        working-directory: .selftest/boot
        env:
          HARNESS_REQUIRE_TOOLCHAINS: '1'
        # The scaffold is a DIFFERENT repository — a fresh `git init` with one commit
        # and no remote. GITHUB_BASE_REF names the base branch of the PR against THIS
        # repo, so leaking it inward makes the append-only migrations check diff
        # against an `origin/main` that does not exist there and fail closed on a
        # correct scaffold.
        # It MUST be unset with `env -u`, not with a step-level `GITHUB_BASE_REF: ''`:
        # the runner re-applies its own GITHUB_* defaults on top of step env, so the
        # empty string never reaches the child (proven — the step env printed empty
        # while the gate still resolved `origin/main`). The canary job unsets it this
        # way per gate; this is the same rule for the whole chain.
        run: env -u GITHUB_BASE_REF node tools/validate.mjs --min-floor
      - name: Warm validate wall-time budget (stamped local experience — fail >120s, warn >90s)
        working-directory: .selftest/boot
        env:
          # CI=false so stamps + caches apply: this measures the LOCAL warm
          # experience an agent gets between edits, not the fail-closed CI run
          # (which just happened above). Stamps were recorded by the cold run.
          CI: 'false'
          HARNESS_REQUIRE_TOOLCHAINS: ''
        run: |
          # env -u GITHUB_BASE_REF: see THE GATE above — the scaffold is a different
          # repo, and a step-level empty string does not survive the runner's GITHUB_* defaults.
          start=$(date +%s)
          env -u GITHUB_BASE_REF node tools/validate.mjs | tee warm-validate.log
          elapsed=$(( $(date +%s) - start ))
          echo "warm validate wall time: ${elapsed}s"
          {
            echo '### Warm validate (stamped) — per-step ms'
            echo '```'
            grep -E '^  ' warm-validate.log || true
            echo '```'
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 120 ]; then echo "::error::warm validate took ${elapsed}s (budget 120s)"; exit 1; fi
          if [ "$elapsed" -gt 90 ]; then echo "::warning::warm validate took ${elapsed}s (target 90s)"; fi
      - name: Warm-lane positive control — the e2e stamp engaged (skipped the jest re-run)
        working-directory: .selftest/boot
        # The cold --min-floor run above recorded the e2e stamp; the warm run must
        # short-circuit the whole jest-expo suite through it. A green warm log
        # WITHOUT this line means the biggest warm-path win silently regressed.
        run: |
          if grep -E '^e2e: OK.*inputs unchanged' warm-validate.log; then
            echo 'e2e stamp engaged on the warm run: OK'
          else
            echo '::error::warm validate did not skip e2e via its stamp — the warm-path win regressed'
            exit 1
          fi
      - name: RLS runner FAILS CLOSED without a database (CI=true)
        working-directory: .selftest/boot
        run: |
          if CI=true node tests/rls/run-rls.mjs > rls-fail.log 2>&1; then
            cat rls-fail.log
            echo '::error::expected fail-closed without a database, got green'
            exit 1
          fi
          grep -q 'failing closed' rls-fail.log || { cat rls-fail.log; echo '::error::the runner reddened WITHOUT the fail-closed message — wrong failure path (log above)'; exit 1; }
          echo 'fail-closed proof: OK'
      - name: Start the Supabase local stack
        working-directory: .selftest/boot
        # `supabase start` brings up the stack's own Postgres + auth schema + GoTrue
        # and applies supabase/migrations from scratch — the same engine the app
        # authenticates against, never a bare postgres container (no auth.uid(), no
        # GoTrue JWTs, none of the RLS predicates this job exists to prove).
        run: supabase start
      - name: RLS isolation suite runs for real and is green
        working-directory: .selftest/boot
        run: |
          set -o pipefail
          CI=true node tests/rls/run-rls.mjs 2>&1 | tee rls.log
          # Positive control: '[rls] OK' is printed ONLY when both runtime layers
          # (pgTAP structure + the SDK cross-tenant suite) ran green against the live
          # stack; a self-skip prints '[rls] SKIPPED' and a leak prints '[rls] FAIL',
          # so this grep cannot false-green a run that never reached the database.
          grep -q '\[rls\] OK' rls.log \
            || { echo '::error::RLS suite did not complete green against the live stack (a self-skip or truncated run)'; exit 1; }
      # W6 armed (the registry-level PORT NOTE retired with it): the source
      # harness's plan-probe lesson, re-proven on THIS schema — the probe must be
      # looking at the DAL's real SQL, not a statement nobody runs.
      - name: 'Canary 17: drop the keyset index → the RLS structure test must FAIL (owner column no longer leads an index)'
        if: matrix.node == 22
        working-directory: .selftest/boot
        run: |
          # notes.org_id is the tenant key every policy qual filters on, and TWO indexes
          # lead with it since the org re-scope: notes_org_id_created_at_id_idx (which
          # also carries the keyset ORDER BY tail) and notes_pkey, which became
          # (org_id, id) so the table is partition-ready. The pgTAP structure suite
          # asserts every owner column leads SOME index, so BOTH have to go for the
          # invariant to be exercised — dropping only the secondary one leaves the PK
          # satisfying it and the canary silently stops biting, which is the exact shape
          # of rot this job exists to catch. Applied directly (not via a migration edit)
          # and restored below.
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'DROP INDEX public.notes_org_id_created_at_id_idx'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'ALTER TABLE public.notes DROP CONSTRAINT notes_pkey'
          if supabase test db > plan-canary.log 2>&1; then
            tail -n 60 plan-canary.log
            echo '::error::PLAN CANARY: the RLS structure suite PASSED with notes.owner_id leading no index — the owner-column-index invariant cannot fail, the exact defect it exists to catch'
            exit 1
          fi
          # Evidence FIRST, then the which-path assertion: the red must come from the
          # owner-column-index invariant naming the (notes, owner_id) pair, not another break.
          if ! grep -Eiq 'LEADING column of some index|owner column' plan-canary.log; then
            tail -n 60 plan-canary.log
            echo '::error::the suite failed, but NOT on the owner-column-index invariant — the canary is not exercising the index-structure surface (log above)'
            exit 1
          fi
          grep -Ei 'Failed test|LEADING column of some index|org_id' plan-canary.log | tail -n 6 || true
          # Restore both so the job's remaining steps see the intended schema.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'ALTER TABLE public.notes ADD CONSTRAINT notes_pkey PRIMARY KEY (org_id, id)'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'CREATE INDEX notes_org_id_created_at_id_idx ON public.notes (org_id, created_at DESC, id DESC)'
          echo 'canary OK: the RLS structure test went red on the dropped keyset index'
      - name: 'Canary 23: a per-role ceiling reset live → the resource-limits runner must FAIL (the ceiling is not merely a row in a migration)'
        if: matrix.node == 22
        working-directory: .selftest/boot
        run: |
          # The static db-limits gate reads migration text; it cannot see a database. This
          # canary removes the ceiling FROM THE LIVE DATABASE — no file changes — so the
          # only layer that can notice is the one that asks the database what is in force.
          #
          # Both runtime layers red on this edit, and they red for DIFFERENT reasons:
          # pgTAP asserts the pg_db_role_setting row EXISTS, the SDK suite asserts
          # PostgREST APPLIED it. That distinction is the whole reason the SDK layer
          # exists beside the catalog assertion: `ALTER ROLE x SET` binds at session start
          # and `SET ROLE` does not re-apply it, so the ceilings bind API traffic only
          # because PostgREST reads pg_db_role_setting for the role it impersonates.
          # A PostgREST upgrade that dropped that behaviour would leave the catalog
          # assertion green and every ceiling gone.
          #
          # THE NOTIFY BELOW IS LOAD-BEARING, and its absence is why this canary failed
          # once: PostgREST serves role settings from its SCHEMA CACHE rather than
          # re-reading the catalog per request, so the ALTER alone changed pg_db_role_setting
          # and the SDK suite went on seeing the cached '3s' and PASSED — the canary was
          # measuring the cache, not the ceiling. Supabase's pgrst_ddl_watch event trigger
          # would normally issue this reload, and it cannot here: event triggers do not fire
          # for shared objects, and roles are shared. Reload explicitly, then assert.
          # (The shipped migration carries the same NOTIFY for the same reason, and
          # tools/check-db-limits.mjs now reds on a ceiling migration that omits it.)
          #
          # So this canary drives the SDK SUITE DIRECTLY rather than `run-rls.mjs`. The
          # runner is fail-fast — pgTAP first, `process.exit(1)` on its failure — so since
          # 0.2.0 added the catalog assertion, the runner now reds BEFORE the SDK layer
          # ever runs and its message could never appear in the log. Going through the
          # runner would have meant asserting a string that cannot be produced, which is a
          # canary that proves nothing while looking rigorous. The env below mirrors what
          # run-rls.mjs hands vitest (tests/rls/run-rls.mjs: RLS_SUITE_READY + the three
          # runtime-read keys), so this is the same invocation, minus the short circuit.
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'ALTER ROLE anon RESET statement_timeout'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
          sleep 2
          if CI=true RLS_SUITE_READY=1 SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" \
             SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
             pnpm exec vitest run tests/rls/resource-limits.test.ts > limits-canary.log 2>&1; then
            tail -n 60 limits-canary.log
            echo '::error::LIMITS CANARY: the SDK resource-limits suite PASSED with anon carrying no statement_timeout — the per-role ceilings cannot fail, the exact defect this layer exists to catch'
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE anon SET statement_timeout = '3s'"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
            exit 1
          fi
          if ! grep -q 'in force but' limits-canary.log; then
            tail -n 60 limits-canary.log
            echo '::error::the SDK suite failed, but NOT on the in-force ceiling assertion — it is red for some other reason and this canary is no longer proving what it claims (log above)'
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE anon SET statement_timeout = '3s'"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
            exit 1
          fi
          # And the catalog layer must ALSO see it — the two halves are independent, and a
          # canary that watched only one would let the other rot.
          if supabase test db > limits-canary-pgtap.log 2>&1; then
            tail -n 40 limits-canary-pgtap.log
            echo '::error::pgTAP PASSED with the anon.statement_timeout row gone from pg_db_role_setting — the catalog assertion is not biting'
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE anon SET statement_timeout = '3s'"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
            exit 1
          fi
          grep -q 'anon.statement_timeout' limits-canary-pgtap.log || {
            tail -n 40 limits-canary-pgtap.log
            echo '::error::pgTAP failed but did not name anon.statement_timeout — red for another reason'
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE anon SET statement_timeout = '3s'"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
            exit 1
          }
          grep -E 'in force but|statement_timeout' limits-canary.log | tail -n 4 || true
          # Restore, so the remaining steps see the intended ceilings.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE anon SET statement_timeout = '3s'"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
          echo 'canary OK: the resource-limits runner went red on a ceiling that exists in every migration and in no live session'
      # The db-scale lane's own falsifiability, and the reason that lane exists at all.
      # Every structural check in this repo is TRUE of a two-row table, and a planner
      # correctly ignores an index on one — so until this ran, the claim the whole
      # tenancy design rests on had nothing that could contradict it.
      - name: 'Scale-seed the stack (the db-scale lane needs cardinality no other lane has)'
        if: matrix.node == 22
        working-directory: .selftest/boot
        run: |
          eval "$(supabase status -o env)"
          # Below the reviewed floor in tools/db-perf-baseline.json the probe SKIPS rather
          # than certifying, so the row count here is not a tuning knob — it is the
          # minimum at which the gate will speak at all.
          time psql "$DB_URL" -q -v ON_ERROR_STOP=1 -v scale_rows=1100000 -f supabase/seeds/scale.sql
      - name: 'Canary 24: drop the keyset index from the live database → db-perf must FAIL on a Sort while schema-rls, tenancy, query-shapes and the pgTAP suite all stay GREEN'
        if: matrix.node == 22
        working-directory: .selftest/boot
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_DB_URL="$DB_URL"
          # POSITIVE CONTROL FIRST. Its own output is the design's central claim made
          # visible for the first time: an InitPlan node with loops=1, and the policy's
          # `org_id = ANY((InitPlan 1).col1)` sitting INSIDE the Index Cond rather than in
          # a Filter — the membership set resolved once per statement, not once per row.
          CI=true node tools/check-db-perf.mjs 2>&1 | tee perf-baseline.log
          grep -q 'db-perf: OK' perf-baseline.log \
            || { echo '::error::the plan probe is not green on the seeded database — the canary below would be meaningless'; exit 1; }
          # THE EDIT: live, no files touched. The index is still declared in the migration
          # and in supabase/schemas, so every gate that reads TEXT is looking at a tree
          # where nothing changed. Only the planner knows.
          #
          # It is NOT the same edit as Canary 17, and the difference is the point: that one
          # drops the keyset index AND the primary key, because pgTAP's leading-column
          # assertion is satisfied by either. This one drops ONLY the keyset index, so the
          # PK still carries org_id, pgTAP still passes all 109 tests, and every list page
          # in the product becomes a filter plus an in-memory sort of the tenant's rows.
          #
          # (The release plan sketched a `org_id::text = $1::text` policy rewrite for this
          # proof; it was tried and does not degrade the plan, because a cast in the POLICY
          # leaves the DAL's own indexable equality in place. Making the tenancy helper
          # VOLATILE was tried too — an uncorrelated sub-select becomes an InitPlan
          # regardless of volatility. This edit is the one that was measured.)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'DROP INDEX public.notes_org_id_created_at_id_idx'
          restore() { psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'CREATE INDEX IF NOT EXISTS notes_org_id_created_at_id_idx ON public.notes (org_id, created_at DESC, id DESC)'; }
          if CI=true node tools/check-db-perf.mjs > perf-canary.log 2>&1; then
            tail -n 40 perf-canary.log
            restore
            echo '::error::PLAN CANARY: db-perf PASSED with the keyset index gone — the one claim the tenancy design rests on cannot fail, the exact defect this lane exists to catch'
            exit 1
          fi
          if ! grep -q 'Sort node' perf-canary.log; then
            tail -n 40 perf-canary.log
            restore
            echo '::error::db-perf failed, but NOT on the Sort assertion — the plan-shape rule is not biting (log above)'
            exit 1
          fi
          grep -E 'Sort node|expected the planner to choose|shared buffers' perf-canary.log | tail -n 6 || true
          # THE OTHER HALF OF THE PROOF, and the half that justifies the lane's cost: with
          # the defect still in place, every check that reads FILES must stay green. If one
          # of them reds here, it is not a stricter harness — it means this canary is not
          # isolating the layer it claims to, and the lane is not proving what it says.
          for gate in check-rls-manifest check-tenancy check-query-shapes; do
            if ! node "tools/$gate.mjs" > "static-$gate.log" 2>&1; then
              cat "static-$gate.log"
              restore
              echo "::error::$gate reddened on a database-only defect — the canary is not isolating the plan layer"
              exit 1
            fi
          done
          if ! supabase test db > static-pgtap.log 2>&1; then
            tail -n 40 static-pgtap.log
            restore
            echo '::error::the pgTAP suite reddened on a dropped SECONDARY index — notes_pkey still leads with org_id, so this is a different break'
            exit 1
          fi
          restore
          echo 'canary OK: only db-perf saw it — schema-rls, tenancy, query-shapes and 109 pgTAP tests were all green with the keyset index gone'
      - name: 'Canary 18: a config plugin emitting run-dependent output → the prebuild ×2 tree compare must FAIL'
        if: matrix.node == 22
        working-directory: .selftest/boot
        run: |
          hash_tree() {
            find apps/mobile/android -type f ! -path '*/.gradle/*' -print0 | sort -z \
              | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
          }
          # Positive control: the CLEAN scaffold's double prebuild is byte-stable
          # (the exact compare the consumer native lane runs).
          ( cd apps/mobile && npx expo prebuild -p android --no-install )
          h1="$(hash_tree)"
          ( cd apps/mobile && npx expo prebuild -p android --no-install )
          h2="$(hash_tree)"
          if [ "$h1" != "$h2" ]; then
            echo "::error::PREBUILD CANARY: the CLEAN scaffold is already nondeterministic ($h1 / $h2) — the baseline is broken, the injection proves nothing"
            exit 1
          fi
          # Injection: a config plugin stamping the manifest with wall-clock —
          # exactly the class of plugin the determinism compare exists to catch.
          mkdir -p apps/mobile/plugins
          cat > apps/mobile/plugins/canary-nondet.js <<'EOF'
          const { withAndroidManifest } = require('expo/config-plugins')
          module.exports = (config) =>
            withAndroidManifest(config, (c) => {
              const application = c.modResults.manifest.application[0]
              application['meta-data'] = [
                ...(application['meta-data'] ?? []),
                { $: { 'android:name': 'canary.stamp', 'android:value': String(Date.now()) } },
              ]
              return c
            })
          EOF
          node -e '
            const fs = require("node:fs");
            const f = "apps/mobile/app.config.ts";
            let s = fs.readFileSync(f, "utf8");
            s = s.replace("plugins: [", "plugins: [\n      \"./plugins/canary-nondet.js\",");
            fs.writeFileSync(f, s);
          '
          grep -q 'canary-nondet' apps/mobile/app.config.ts \
            || { echo '::error::the canary injection did not apply — app.config.ts has no plugins array to extend'; exit 1; }
          ( cd apps/mobile && npx expo prebuild -p android --no-install )
          h3="$(hash_tree)"
          ( cd apps/mobile && npx expo prebuild -p android --no-install )
          h4="$(hash_tree)"
          if [ "$h3" = "$h4" ]; then
            echo "::error::PREBUILD CANARY: two prebuilds with a Date.now() plugin produced IDENTICAL trees ($h3) — the compare cannot see nondeterminism, so the consumer native lane is decoration"
            exit 1
          fi
          rm -rf apps/mobile/android apps/mobile/plugins
          git checkout -q -- apps/mobile/app.config.ts
          echo "canary OK: the injected plugin broke the tree hash ($h3 != $h4) and the clean baseline was stable"

  # ---------------------------------------------------------------------------
  # The mobile<->web integration lane, proven on a REAL scaffold: apps/web hosts
  # /api/trpc, the mobile client's REAL createApiClient attaches the Supabase
  # session bearer (client.ts's httpBatchLink headers callback), FORCE RLS binds
  # it to auth.uid(), and the live-api-proof suite drives the whole path against
  # the Supabase local stack (LIVE_PROOF=1 — the same suite the consumer
  # integration-lane job runs). Canary C01 is the lane's reason to exist: strip
  # the ONE line that attaches the Authorization header and the suite MUST red —
  # the source harness once shipped exactly that hole with every mocked lane green.
  #
  # PRECONDITION — apps/web boots under `next dev` and serves /api/trpc. The
  # Rule 6 on the SECOND preset: a metal scaffold (init --set DESIGN_TOKENS=metal)
  # is validate-green with zero edits. One node-22 leg and no database — the
  # live-stack story is preset-independent and stays with bootstrap-linux /
  # integration on the default path. The vitest step exists because the token
  # contract + freshness suites (the unit lane) live in the Stop chain, not in
  # VALIDATE_STEPS, and they are exactly what a stale metal overlay would red.
  metal-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Bootstrap a METAL project from the template
        run: node installer/cli.mjs init --dir "$GITHUB_WORKSPACE/.selftest/metal" --tier core --yes --set DESIGN_TOKENS=metal
      - name: Git baseline + corepack (lefthook prepare and the diff-based gates need a repo)
        working-directory: .selftest/metal
        run: |
          git init -q -b main
          git add -A
          git -c user.email=selftest@localhost -c user.name=selftest commit -qm 'scaffold baseline'
          corepack enable
          corepack prepare --activate
      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: .selftest/metal
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node22-${{ hashFiles('template/base/pnpm-workspace.yaml', 'template/**/package.json.tmpl') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node22-
      - name: pnpm install
        working-directory: .selftest/metal
        run: pnpm install --no-frozen-lockfile
      - name: Put the workspace-local Supabase CLI on PATH
        working-directory: .selftest/metal
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: THE GATE on metal — full validate must be green out of the box
        working-directory: .selftest/metal
        env:
          HARNESS_REQUIRE_TOOLCHAINS: '1'
        # env -u GITHUB_BASE_REF for the same reason bootstrap-linux does it: the
        # scaffold is a different repository, and leaking the PR base ref inward
        # makes the append-only migrations check diff against a remote that does
        # not exist there.
        run: env -u GITHUB_BASE_REF node tools/validate.mjs --min-floor
      - name: Token unit suites on metal (contract + freshness run under vitest, not the chain)
        working-directory: .selftest/metal
        run: pnpm exec vitest run packages/design-tokens packages/design-system-native

  # ---------------------------------------------------------------------------
  # THE UPGRADE LANE. bootstrap-linux proves a FRESH scaffold is green; nothing
  # here proved that an EXISTING install survives a release. Those are different
  # claims — a fresh scaffold has no manifest vintage, so it can never be pre- or
  # post-ramp, never carries seeded drift, and never exercises a single line of
  # the plant-vs-withhold decision that every migrations.json record is made of.
  # The 0.2.0 changelog records an update-planted defect found "by running the
  # real upgrade, not by reading the plan": a manual act with no CI successor,
  # which means the next one would not be found at all.
  #
  # This lane is the release gate for every ramp and migration claim in the
  # release. It installs the PREVIOUS release tag, runs HEAD's `update`, and then
  # asserts what only an upgraded install can show: the injected chain steps
  # arrived, the planted data files are there and the tolerated-absent ones are
  # not, doctor never says broken, the chain is green, every ramp NOTE names the
  # release it expires in, and `graduate` refuses while those NOTEs stand.
  # ---------------------------------------------------------------------------
  upgrade-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The lane installs FROM the previous release tag, so the tags — and the
          # history reachable from them — must be present. A shallow clone would make
          # the baseline unresolvable, and the script fails closed rather than skipping.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-node22-${{ hashFiles('template/base/pnpm-workspace.yaml', 'template/**/package.json.tmpl') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node22-
      - name: init at the previous release tag → update to HEAD → prove green
        run: bash scripts/ci/upgrade-lane.sh "$GITHUB_WORKSPACE/.selftest/upgrade"
      - name: Upgrade report
        if: always()
        run: |
          {
            echo '### Upgrade lane'
            for f in update doctor validate graduate; do
              log=".selftest/upgrade/$f.log"
              [ -f "$log" ] || continue
              echo "<details><summary>$f</summary>"
              echo
              echo '```'
              tail -c 20000 "$log"
              echo '```'
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # workspace packages ship raw TypeScript with NodeNext `.js` import specifiers;
  # Next 16's default Turbopack bundler does not rewrite `.js`->`.ts`, so the web
  # scripts run with `--webpack` and apps/web/next.config.ts adds
  # `resolve.extensionAlias` — the web analog of the Metro `.js`->`.ts` resolver
  # shim (see that file for the trade and the Turbopack alternative). If the boot
  # step below never reaches /api/trpc/system.health, that resolver mapping — or
  # the Supabase env published above — is the first thing to check.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_INTEGRATION_LANE: '1'
      LIVE_PROOF: '1'
      NODE_ENV: development
      # apps/web IS the API host in this lineage: the lane boots the web app and
      # the mobile client talks to its origin, so the transport under test is the
      # one production uses — there is no separate server to start.
      EXPO_PUBLIC_WEB_ORIGIN: 'http://127.0.0.1:3000'
    # No `services:` block — the database under test is the Supabase local stack,
    # started by its own CLI below (see bootstrap-linux: a bare postgres container
    # would have no auth schema, no auth.uid(), no GoTrue JWTs).
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Bootstrap a fresh project
        run: node installer/cli.mjs init --dir "$GITHUB_WORKSPACE/.selftest/app" --tier core --yes
      - name: Git baseline + corepack
        working-directory: .selftest/app
        run: |
          git init -q -b main
          git add -A
          git -c user.email=selftest@localhost -c user.name=selftest commit -qm 'scaffold baseline'
          corepack enable
          corepack prepare --activate
      - name: pnpm install
        working-directory: .selftest/app
        run: pnpm install --no-frozen-lockfile
      # See the bootstrap-linux job: the catalog-pinned CLI lives in node_modules/.bin,
      # which a `run:` step's PATH does not carry.
      - name: Put the workspace-local Supabase CLI on PATH
        working-directory: .selftest/app
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start the Supabase local stack
        working-directory: .selftest/app
        run: supabase start
      - name: Publish the local Supabase env to the job
        working-directory: .selftest/app
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL%/}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE=${ANON_KEY}"
            echo "NEXT_PUBLIC_WEB_ORIGIN=http://127.0.0.1:3000"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=${DB_URL}"
            echo "SUPABASE_URL=${API_URL%/}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "EXPO_PUBLIC_SUPABASE_URL=${API_URL%/}"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE=${ANON_KEY}"
          } >> "$GITHUB_ENV"
      - name: Boot the web app (which hosts /api/trpc)
        working-directory: .selftest/app
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter web run dev > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            # The health PROCEDURE, not the page: a 200 from system.health proves
            # the tRPC router mounted and reached the database, not merely that Next
            # is serving.
            if curl -fsS -m 2 "http://127.0.0.1:3000/api/trpc/system.health" > /dev/null; then
              echo "web up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the web app never served a healthy /api/trpc/system.health"; cat /tmp/web.log; exit 1
      - name: Baseline — the LIVE_PROOF suite is green against the real stack
        working-directory: .selftest/app
        run: pnpm --filter mobile exec jest --silent __tests__/live-api-proof.test.ts
      - name: 'Canary C01: strip the Authorization header from the api-client one door → the live suite must FAIL'
        working-directory: .selftest/app
        run: |
          # Remove the ONE line that attaches the Supabase session bearer inside
          # createApiClient's httpBatchLink headers() callback — the exact defect
          # class the source harness once shipped while every mocked lane stayed
          # green. Heredoc so the template literal reaches node verbatim.
          node <<'NODE'
          const fs = require("node:fs")
          const f = "apps/mobile/src/lib/trpc/client.ts"
          let s = fs.readFileSync(f, "utf8")
          const needle = ": { 'x-client-version': CLIENT_VERSION, authorization: `Bearer ${token}` }"
          if (!s.includes(needle)) {
            console.error("::error::the canary injection did not apply — the api-client bearer line moved; fix the injection, do not delete the canary")
            process.exit(1)
          }
          s = s.replace(needle, ": { 'x-client-version': CLIENT_VERSION }")
          fs.writeFileSync(f, s)
          NODE
          if pnpm --filter mobile exec jest --silent __tests__/live-api-proof.test.ts > c01.log 2>&1; then
            cat c01.log
            echo '::error::C01: the live suite PASSED with no Authorization header attached — the integration lane cannot see the auth seam, so it is decoration'
            exit 1
          fi
          # With no bearer, every authed procedure throws UNAUTHORIZED at the
          # transport before any handler runs; the tRPC client surfaces it as
          # `TRPCClientError: authentication required`.
          if ! grep -Eiq 'TRPCClientError: authentication required|unauthor' c01.log; then
            cat c01.log
            echo '::error::C01: the suite reddened WITHOUT the auth-shaped failure — wrong failure path (log above)'
            exit 1
          fi
          grep -Ei 'TRPCClientError: authentication required|unauthor' c01.log | head -n 4
          git checkout -q -- apps/mobile/src/lib/trpc/client.ts
          echo 'canary OK: stripping the bearer reddened the live suite'
      - name: Restore sanity — the suite is green again after the revert
        working-directory: .selftest/app
        run: pnpm --filter mobile exec jest --silent __tests__/live-api-proof.test.ts
      - name: Web log on failure
        if: failure()
        run: cat /tmp/web.log || true

  # ---------------------------------------------------------------------------
  # maestro-smoke — the emulator lane on a REAL scaffold, schedule/dispatch only
  # (a KVM emulator + two gradle assembles per PR would double every merge's
  # wall clock). Proves the whole W6 device story end-to-end: the release
  # binary's route flows + generated sweep, the kv-pre-seeded ar-XB/RTL boot,
  # the mutation flow against the real server, the perf-harness marker — and the
  # two device canaries no repo test can run: a broken testID must red the
  # device sweep while the agent-time jest lane stays GREEN (Canary 19, the
  # honest-loss proof, both halves asserted), and a 300ms busy-loop on the
  # ranking path must flip the perf marker (Canary 20).
  # ---------------------------------------------------------------------------
  maestro-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: development
      # apps/web hosts /api/trpc; the mobile binary talks to its origin. The
      # per-request bearer comes from the Supabase session, not an out-of-band mint.
      EXPO_PUBLIC_WEB_ORIGIN: 'http://127.0.0.1:3000'
    # No `services:` block — the database under test is the Supabase local stack,
    # started by its own CLI below (see bootstrap-linux for why a bare postgres
    # service container would be the wrong engine).
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install Maestro CLI (pinned zip, sha256-verified — the install script verifies nothing)
        run: |
          curl -fsSL -o maestro.zip https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.6.1/maestro.zip
          echo "3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME/.maestro-dist"
          echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"
      - name: Bootstrap a fresh project
        run: node installer/cli.mjs init --dir "$GITHUB_WORKSPACE/.selftest/app" --tier core --yes
      - name: Git baseline + corepack
        working-directory: .selftest/app
        run: |
          git init -q -b main
          git add -A
          git -c user.email=selftest@localhost -c user.name=selftest commit -qm 'scaffold baseline'
          corepack enable
          corepack prepare --activate
      - name: pnpm install
        working-directory: .selftest/app
        run: pnpm install --no-frozen-lockfile
      # See the bootstrap-linux job: the catalog-pinned CLI lives in node_modules/.bin,
      # which a `run:` step's PATH does not carry.
      - name: Put the workspace-local Supabase CLI on PATH
        working-directory: .selftest/app
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start the Supabase local stack
        working-directory: .selftest/app
        run: supabase start
      - name: Publish the local Supabase env to the job
        working-directory: .selftest/app
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL%/}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE=${ANON_KEY}"
            echo "NEXT_PUBLIC_WEB_ORIGIN=http://127.0.0.1:3000"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=${DB_URL}"
          } >> "$GITHUB_ENV"
      - name: Boot the web app (the mutation flow's backend — hosts /api/trpc)
        working-directory: .selftest/app
        run: |
          set -euo pipefail
          pnpm --filter web run dev > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -m 2 "http://127.0.0.1:3000/api/trpc/system.health" > /dev/null; then
              echo "web up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the web app never served a healthy /api/trpc/system.health"; cat /tmp/web.log; exit 1
      - name: Prebuild + assemble (release for the sweeps, debug for the dev half)
        working-directory: .selftest/app/apps/mobile
        # EXPO_PUBLIC_* are inlined at BUNDLE time, so the mobile Supabase config +
        # web origin must ride the gradle step's env. They were published to the job
        # env from the running stack by the step above; the release binary boots
        # signed-out against that stack, and the local publishable key is NOT a secret
        # (it is the ANON key GoTrue issues to every client). The device lane
        # (scripts/ci/device-smoke.sh) adb-reverses these ports to the host.
        run: |
          export EXPO_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE"
          export EXPO_PUBLIC_WEB_ORIGIN='http://127.0.0.1:3000'
          npx expo prebuild -p android --no-install
          cd android
          ./gradlew assembleRelease assembleDebug
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-aosp-atd-x86_64
      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Device smoke + canaries (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: .selftest/app
          script: |
            bash "$GITHUB_WORKSPACE/scripts/ci/device-smoke.sh"
      - name: Server + Metro logs on failure
        if: failure()
        run: |
          echo '::group::server.log'; cat /tmp/server.log || true; echo '::endgroup::'
          echo '::group::metro.log'; cat /tmp/metro.log || true; echo '::endgroup::'
      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-smoke-evidence
          path: .selftest/app/artifacts/maestro/
          retention-days: 7
          if-no-files-found: ignore
