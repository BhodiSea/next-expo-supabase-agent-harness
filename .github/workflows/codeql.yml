# CodeQL SAST over the FACTORY's own source (1.0.2): installer/, scripts/, tests/, the
# gate scripts and hooks under template/, and these workflows themselves (the 'actions'
# language catches untrusted-input and injection bugs in CI).
#
# Until this release the harness shipped this lane to every consumer
# (template/base/github/workflows/codeql.yml) and did not run it on itself: the only
# codeql-action use here was scorecard.yml's SARIF upload, and OpenSSF Scorecard's SAST
# check said so. Same action, same full-SHA pin, same query suite as the shipped copy, so
# this repo is a live test of the lane consumers get.
#
# Runs on every pull request and push to main, plus a nightly full scan. NOT awaited by
# release.yml, which blocks on selftest.yml and lint.yml: findings surface in the
# Security tab and are triaged there, and the blocking static-analysis gates stay the
# lint.yml jobs whose non-zero exit is the red.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full nightly scan. 03:41 UTC, clear of hygiene (04:17) and scorecard (04:30 Mon).
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality = every security-extended query plus the reliability
          # and maintainability ones (1.0.3; was security-extended).
          queries: security-and-quality
          # CodeQL's JavaScript extractor skips hidden folders other than .github, so it
          # analyzes no script that template/base/.claude/ ships. Until 2.0.7 it analyzed
          # the slice scaffolder through its copy in plugin/ (#163).
          # tests/evals/b/fixture/ (#188) is eval B's frozen copy of the 2.0.0 template: data
          # the sweep reads, never run, and analyzed at its source when it shipped.
          config: |
            paths-ignore:
              - tests/evals/b/fixture/**
      - name: Analyze
        uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          category: '/language:${{ matrix.language }}'
