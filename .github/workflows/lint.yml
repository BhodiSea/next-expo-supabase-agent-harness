# Lint the harness repo itself: workflow syntax + Actions security posture.
# Template workflows are stored dotless (template/**/github/workflows/) so they
# never execute here — stage them into .fixtures to lint them anyway.
name: lint

on:
  pull_request:
  push:
    branches: [main]
    # Tag-time parity (0.7.0): these gates also execute AT THE TAG REF, and release.yml
    # blocks publish on a green run of this workflow for the tag SHA (via
    # scripts/ci/wait-for-workflows.mjs). The v0.6.0 failure class was a control
    # answering differently on the tag ref than on main — the same SHA green on a branch
    # runs under the WRONG ref context, and previousTag-class questions (machinery-lint's
    # dependency-channel diff, the ramp-ledger's previous-tag read) are exactly
    # ref-contextual. The concurrency group below keys on github.ref, so a tag run and a
    # branch run land in different groups and can never cancel each other.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Stage template workflows (stored dotless so they never execute here)
        run: |
          mkdir -p .fixtures/tpl/.github/workflows
          find template -path '*/github/workflows/*.yml' -exec cp {} .fixtures/tpl/.github/workflows/ \;
          # NOTE: custom runner labels for these fixtures (eval-live's gpu box) are
          # declared in the REPO ROOT .github/actionlint.yaml — actionlint resolves
          # config from the project root (first .git walking up), not the fixture dir.
          ls .fixtures/tpl/.github/workflows
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: |
            .github/workflows/*.yml
            .fixtures/tpl/.github/workflows/*.yml

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # Fail the job on findings instead of uploading SARIF — the same choice the
          # template makes in its shipped actions-lint.yml, and for the same reason:
          # upload-sarif needs `actions: read` AND GitHub Advanced Security, so the
          # SARIF path cannot work on a private repo and adds a scope this job does
          # not otherwise need. Failing on findings is what a release gate wants.
          advanced-security: false

  # The dual-license claim (Apache-2.0 repo-wide, Apache-2.0 OR 0BSD under
  # template/**) is machine-verifiable: the real reuse tool asserts REUSE spec
  # 3.3 compliance, and the dependency-free structural mirror additionally
  # pins README/CITATION.cff/package.json license consistency with REUSE.toml.
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: reuse lint (REUSE spec 3.3)
        env:
          # renovate: datasource=pypi depName=reuse
          REUSE_VERSION: 6.2.0
        run: pipx run "reuse==${REUSE_VERSION}" lint
      - name: Structural mirror + license-consistency
        run: node scripts/check-reuse.mjs

  syntax-and-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # fetch-depth: 0 brings the tags with it. check-seeded-migrations below
          # diffs template/ against the previous RELEASE TAG, and it deliberately
          # refuses to run on a shallow clone: there, "this repo has no releases
          # yet" is indistinguishable from "the tags were never fetched", and
          # guessing wrong turns the gate into a vacuous pass.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: node scripts/check-syntax.mjs
      - name: seedOnInitOnly completeness (an unregistered seeded addition auto-plants into every existing install on `update`)
        run: node scripts/check-seeded-migrations.mjs
      - name: Validate Claude Code plugin manifests (advisory)
        continue-on-error: true
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .

  # The machinery under its own bar: the installer/scripts/tests/gate scripts +
  # hooks that enforce strictTypeChecked, cognitive-complexity <= 15 and knip on
  # consumers are themselves held to the same bar. Template files are linted AS
  # REPO SOURCE (template/stack app code stays owned by the consumer config).
  machinery-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # machinery-dependency-channel computes the catalog delta against the previous
          # release TAG, and machinery-ramp-ledger reads the previous tag's gate sources.
          # Both SKIP LOUDLY without history and FAIL CLOSED here (CI=true), so a shallow
          # checkout would turn two blocking controls into a skip.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: corepack pnpm (pinned via root packageManager)
        run: |
          corepack enable
          corepack prepare --activate
      - name: Install root dev toolchain (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: machinery-eslint (complexity budget + ratchet; a stale disable is red)
        run: pnpm exec eslint .
      # The CEILING the eslint disables cannot enforce (G16): a disabled function can grow
      # without limit and `eslint .` stays green. This re-lints with --no-inline-config and
      # fails if any ratcheted function grew past its committed record.
      - name: machinery-complexity-ratchet (no ratcheted function grew; G16)
        run: node scripts/check-complexity-ratchet.mjs
      # The boundary rules the runner-kind canaries cannot see fire (G28): a deleted or
      # regex-narrowed depcruise architecture rule, or a disappeared eslint import-ban, leaves
      # the gate green over code it should reject.
      - name: machinery-rule-integrity (config-driven boundary rules intact; G28)
        run: node scripts/check-rule-integrity.mjs
      # A ramp whose escape was never reachable is a check shipped unconditional wearing a
      # ramp's clothes, and its `until` is decoration. This computes the fleet instead.
      - name: machinery-ramp-ledger (no never-armed ramp; the expiry population is derived)
        run: node scripts/check-ramp-ledger.mjs
      # The closure enforcement-tiers.md promised for 0.4.0: a shipped gate that scans one
      # product surface and has no row there is an undeclared tier.
      - name: machinery-tier-coverage (every one-surface gate declares its surface)
        run: node scripts/check-tier-coverage.mjs
      # The three hand-maintained copies of the reviewed-data set (SEEDED_FILES,
      # ESCAPE_LISTS, WRITE_PROTECTED) must agree. enforcement-surface.mjs's header
      # promised the drift would be invisible; on its first run this found three.
      - name: machinery-escape-registry (the three escape-hatch lists reconcile)
        run: node scripts/check-escape-registry.mjs
      # A dependency a harness-OWNED config needs must reach an EXISTING install, not just
      # a fresh scaffold. 0.4.0 shipped a config importing eslint-plugin-jsx-a11y against a
      # pin no upgraded tree had, and eslint died before linting a file.
      - name: machinery-dependency-channel (every owned-config dependency has a channel)
        run: node scripts/check-dependency-channel.mjs
      # The release's forward obligations in ONE machine-read register (0.9.0):
      # kind:release rows red clocklessly when package.json reaches their target, the
      # deferrals census and the future-until ramp fleet close as unions, and prose
      # anchors must resolve. The kind:calendar half runs ONLY in hygiene.yml's
      # scheduled job (--clockful) — a verdict that changes with the date must never
      # red a PR, the same split floor-review makes for the framework floor.
      - name: machinery-obligations (the obligations register; the clockless half)
        run: node scripts/check-obligations.mjs
      # The shipped CI's entry path stays satisfiable (0.9.0): every `pnpm install` in a
      # shipped workflow spells its lockfile posture, setup-node's `cache: pnpm` demand is
      # backed by init's committed-lockfile next-steps note (the cross-file half), and every
      # action reference is SHA-pinned with a version comment. The executed proof is the
      # consumer-ci-static selftest lane; this is its per-commit static closure.
      - name: machinery-ci-preconditions (the shipped CI's entry path is satisfiable; actions pinned)
        run: node scripts/check-ci-preconditions.mjs
      - name: machinery-types (tsc --noEmit, allowJs+checkJs over the same globs)
        run: pnpm exec tsc --noEmit
      - name: machinery-knip (dead exports/files/deps across installer, scripts, tools)
        run: pnpm exec knip
