# Release: tag v* → verify CHANGELOG section → publish a GitHub Release with
# SLSA L2 build provenance on the packed installer tarball.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Every `run:` step under bash -eo pipefail. A step that names no shell runs as `bash -e`,
# WITHOUT pipefail, so `producer | tee file` reports tee's status and the producer's
# failure is swallowed. Selecting the shell here closes that for the whole workflow.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # THE GATES BELOW ASK QUESTIONS ABOUT RELEASE HISTORY, so this job needs it. At the
          # default depth a TAG PUSH fetches exactly the ref being built: `git tag --list`
          # returns the one tag, and every check that corroborates something against prior
          # releases — the VINTAGES closure, the deadline ratchet, the dependency channel's
          # diff against the previous release — is either vacuous or, worse, answers from a
          # one-element view of history. The v0.6.0 build failed here, reporting all six of
          # its own released vintages as tags that never existed. `machinery-lint` in
          # selftest.yml already checks out this way, and for the same reason.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Gates
        run: |
          node scripts/check-syntax.mjs
          node scripts/hygiene.mjs
          node scripts/check-release-lockstep.mjs
          node --test "tests/**/*.test.mjs"
      - name: Publish blocks on green selftest.yml AND lint.yml runs for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        # Tag-time parity (0.7.0, W8): lint.yml now runs at the tag ref too, so the
        # ref-contextual gates (machinery-lint's dependency-channel diff above all) are
        # proven AT the ref being released, and publish blocks on both workflows. The
        # wait's verdict logic lives in scripts/ci/wait-for-workflows.mjs — extracted
        # from the inline YAML it replaced, same gh transport and same 90 × 60 s budget —
        # precisely so tests/gates/wait-for-workflows.test.mjs can falsify it (all-green
        # → 0; any all-failed → hard fail naming it; ZERO runs for a required workflow →
        # hard fail after the timeout, because absence-as-pending-forever is the
        # silent-skip shape). hygiene.yml is tag-triggered as well but deliberately
        # UNAWAITED here: its corpus-fidelity job is a network scan whose redness is a
        # property of the internet that day, not of this SHA — blocking a release on it
        # converts flake into a stuck tag (the hygiene GATE itself already ran inline in
        # the Gates step above).
        run: node scripts/ci/wait-for-workflows.mjs selftest.yml lint.yml
      - name: CHANGELOG must have a section for this tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## \\[${TAG}\\]" CHANGELOG.md || {
            echo "CHANGELOG.md is missing a '## [${TAG}]' section" >&2; exit 1; }
          awk "/^## \\[${TAG}\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Pack
        run: npm pack
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        id: provenance
        with:
          subject-path: '*.tgz'
      # The step above files the attestation in GitHub's attestation store, which
      # `gh attestation verify` queries and a release page never shows. A verifier holding
      # only the release assets therefore had nothing to check against, and OpenSSF
      # Scorecard — whose Signed-Releases check reads ASSETS, not the store — scored this
      # repository 0 on that check on 2026-09-22 while every 1.0.x release was in fact
      # attested. Publishing the bundle the action already produced, under the name the
      # check recognises, closes both. It is a copy of existing signed material, not a
      # second signature: same Sigstore bundle, same digest, same workflow identity.
      - name: Carry the provenance bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          TARBALL="$(ls ./*.tgz)"
          cp "$BUNDLE_PATH" "${TARBALL}.intoto.jsonl"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.tgz ./*.tgz.intoto.jsonl \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # npm (1.1.0, #161). The registry gets the SAME FILE the GitHub Release carries: the
  # tarball `release` packed and attested, fetched back from the release, checked against
  # its own bundle, and published as-is through trusted publishing (OIDC). No npm token
  # exists for this package, so `id-token: write` is the only credential the job holds,
  # and npm signs a provenance statement linking the version to this run. Re-packing is
  # never done here: one artifact, two attestations over the same bytes.
  #
  # The npm side is configured by hand, once: the package exists (trusted publishing cannot
  # create one, so its first version is published manually), its trusted publisher names
  # this repository, `release.yml` and the `npm` environment, and its publishing access is
  # "require two-factor authentication and disallow tokens". The `npm` environment admits
  # only `v*` tags (CONTRIBUTING.md, "Releases").
  #
  # The setup-node shape is npm's own documented one: Node 24, whose bundled npm is past
  # trusted publishing's 11.5.1 floor (no `npm install -g npm`, which Scorecard counts as
  # unpinned), `registry-url` (how Scorecard's Packaging check recognises a publish), and no
  # cache in a release build. NODE_AUTH_TOKEN is never set: setup-node then writes a dummy,
  # so a failed OIDC exchange fails the publish instead of signing in as anyone.
  #
  # npm's OIDC exchange does not throw; it falls back to whatever credential is configured.
  # So `npm publish` exiting 0 proves nothing about how the version was published, and the
  # last step reads the registry back: the attested bytes, SLSA provenance, and the GitHub
  # trusted publisher, or the job is red (scripts/ci/npm-publish.mjs, tested by
  # tests/gates/npm-publish.test.mjs).
  #
  # A copy of this repository made for another stack skips the job until it renames the
  # package and sets up its own trusted publisher (docs/forking.md).
  publish-npm:
    needs: release
    if: github.repository == 'BhodiSea/next-expo-supabase-agent-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read # the checkout, and `gh release download` of the release's assets
      id-token: write # the OIDC token npm exchanges to publish, and signs provenance with
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Fetch the release's tarball and its provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/dist" \
            --pattern '*.tgz' --pattern '*.tgz.intoto.jsonl'
      - name: The tarball verifies against the release workflow's attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL="$(ls "$RUNNER_TEMP"/dist/*.tgz)"
          gh attestation verify "$TARBALL" --bundle "${TARBALL}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
      - name: Publish through the trusted publisher
        run: |
          TARBALL="$(ls "$RUNNER_TEMP"/dist/*.tgz)"
          DIST_TAG="$(node scripts/ci/npm-publish.mjs tag "${GITHUB_REF_NAME#v}")"
          npm publish "$TARBALL" --tag "$DIST_TAG"
      - name: The registry holds the attested tarball, with provenance, from the trusted publisher
        run: |
          TARBALL="$(ls "$RUNNER_TEMP"/dist/*.tgz)"
          node scripts/ci/npm-publish.mjs verify "$TARBALL" "${GITHUB_REF_NAME#v}"
