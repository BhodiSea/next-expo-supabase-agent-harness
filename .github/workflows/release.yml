# Release: tag v* → verify CHANGELOG section → publish a GitHub Release with
# SLSA L2 build provenance on the packed installer tarball.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # THE GATES BELOW ASK QUESTIONS ABOUT RELEASE HISTORY, so this job needs it. At the
          # default depth a TAG PUSH fetches exactly the ref being built: `git tag --list`
          # returns the one tag, and every check that corroborates something against prior
          # releases — the VINTAGES closure, the deadline ratchet, the dependency channel's
          # diff against the previous release — is either vacuous or, worse, answers from a
          # one-element view of history. The v0.6.0 build failed here, reporting all six of
          # its own released vintages as tags that never existed. `machinery-lint` in
          # selftest.yml already checks out this way, and for the same reason.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Gates
        run: |
          node scripts/check-syntax.mjs
          node scripts/hygiene.mjs
          node scripts/check-release-lockstep.mjs
          node --test "tests/**/*.test.mjs"
      - name: Publish blocks on green selftest.yml AND lint.yml runs for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        # Tag-time parity (0.7.0, W8): lint.yml now runs at the tag ref too, so the
        # ref-contextual gates (machinery-lint's dependency-channel diff above all) are
        # proven AT the ref being released, and publish blocks on both workflows. The
        # wait's verdict logic lives in scripts/ci/wait-for-workflows.mjs — extracted
        # from the inline YAML it replaced, same gh transport and same 90 × 60 s budget —
        # precisely so tests/gates/wait-for-workflows.test.mjs can falsify it (all-green
        # → 0; any all-failed → hard fail naming it; ZERO runs for a required workflow →
        # hard fail after the timeout, because absence-as-pending-forever is the
        # silent-skip shape). hygiene.yml is tag-triggered as well but deliberately
        # UNAWAITED here: its corpus-fidelity job is a network scan whose redness is a
        # property of the internet that day, not of this SHA — blocking a release on it
        # converts flake into a stuck tag (the hygiene GATE itself already ran inline in
        # the Gates step above).
        run: node scripts/ci/wait-for-workflows.mjs selftest.yml lint.yml
      - name: CHANGELOG must have a section for this tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## \\[${TAG}\\]" CHANGELOG.md || {
            echo "CHANGELOG.md is missing a '## [${TAG}]' section" >&2; exit 1; }
          awk "/^## \\[${TAG}\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Pack
        run: npm pack
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: '*.tgz'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
