# Hygiene gate: no project-specific strings, credential shapes, or sibling-stack
# leftovers may leak into template/, and the placeholder registry must be closed
# over the template tree. Blocks every PR and release.
name: hygiene

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Nightly: the corpus-fidelity job below reaches the NETWORK, so it cannot ride the
    # per-PR path (a flaky host must never red someone's PR). A cited authority that
    # 404s is still a broken citation — it just gets caught within a day, not a minute.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` step under bash -eo pipefail. A step that names no shell runs as `bash -e`,
# WITHOUT pipefail, so `producer | tee file` reports tee's status and the producer's
# failure is swallowed. Selecting the shell here closes that for the whole workflow.
defaults:
  run:
    shell: bash

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # The private-name check reads its list from this secret. A fork's pull request and a
      # Dependabot run get no secrets, and the check says it skipped. A push to main or a
      # tag in this repository must run it, so there the flag makes a missing list fail.
      - run: node scripts/hygiene.mjs
        env:
          HYGIENE_PRIVATE_NAMES: ${{ secrets.HYGIENE_PRIVATE_NAMES }}
          HYGIENE_REQUIRE_PRIVATE_NAMES: ${{ github.repository_id == '1308800605' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && '1' || '' }}
      # G12: the harness's own quantitative claims must be TRUE and mutually consistent.
      # The source harness's v0.1.5 shipped a README claiming cold ≈70 s while the
      # CHANGELOG claimed ≈85 s for the same release — "prove, don't claim" has to
      # apply to the harness itself.
      - run: node scripts/check-claims.mjs

  corpus-fidelity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Every cited corpus authority resolves (dead link = broken citation)
        run: node scripts/check-corpus-fidelity.mjs

  # The CLOCKFUL half of the obligations register, and the ONLY place it runs: a
  # kind:calendar row's verdict changes with the date, so it rides the schedule the way
  # corpus-fidelity's network half does — a deadline arriving overnight opens a red the
  # next morning instead of ambushing somebody's unrelated PR. The clockless half
  # (release rows, census, ramp unions, anchors) blocks every PR in lint.yml's
  # machinery block.
  obligations-clockful:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Calendar obligations judged against today (schedule/dispatch only)
        run: node scripts/check-obligations.mjs --clockful

  # The SEEDS' review windows, judged against today (0.9.9). The consumer's `floor-review`
  # job asks this same question of tools/framework-floor.json and tools/eol.json — but only
  # inside an install. The copies under template/base/tools/ are what every future scaffold
  # is rendered FROM, and nothing judged those, so a review could lapse here and the first
  # thing to notice would be a consumer whose brand-new project reds on its first weekly
  # cron for research this repository never re-read. Schedule/dispatch-only for the reason
  # obligations-clockful is: the verdict changes with the date and nothing else.
  registers-clockful:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Shipped review-dated registers have not lapsed (schedule/dispatch only)
        run: node scripts/check-register-freshness.mjs

  # The SEEDS' floor and catalog pin against the published ADVISORIES (1.1.0, #81).
  # registers-clockful above reads only the review dates, version-sync compares the pin
  # with the floor rather than the floor with a feed, and factory-sca's lockfile resolves no
  # `next` — so the vendor's 2026-08-25 security release sat inside a live review window and
  # was noticed only when the window lapsed. This job asks OSV and the upstream repository's
  # published advisories about every minPatchByMajor version and the exact pin, and reds on
  # any advisory that affects one and is not a row in the floor. OSV decides what it lists;
  # the vendor's free-text range is read only for an advisory OSV does not list yet. A copy of
  # registers-clockful, schedule/dispatch-only because the verdict changes with the feeds and
  # not with the commit; its one addition is the job's read-only token, which lifts the
  # upstream listing off the unauthenticated REST limit.
  floor-advisories:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: The shipped floor and catalog pin carry no unrecorded advisory (schedule/dispatch only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-floor-advisories.mjs

  # The factory's OWN SCA lane (0.9.5, the SCA half of the retired
  # vuln-sla-and-factory-sca row): an OSV scan over THIS repo's pnpm-lock.yaml — the
  # toolchain that builds the harness, not the consumer surface (consumers get the
  # shipped osv-scan.yml plus the framework floor). Schedule/dispatch ONLY, and the home
  # is doctrine rather than convenience: an OSV scan resolves against a live
  # vulnerability feed — the definition of clockful — and a control that reds an
  # untouched commit overnight is a control someone removes. release.yml deliberately
  # does not await this workflow. Same Google reusable workflow, same full-SHA pin, as
  # the shipped consumer lane; Renovate keeps the pin current.
  factory-sca:
    name: factory sca (osv, full tree)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
