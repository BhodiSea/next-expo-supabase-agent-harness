# maestro/journeys/session.yaml — the on-device SESSION flow (2.0.0): sign in through the
# app's own screen, read the signed-in user's second-factor list from the server, relaunch,
# and prove the session SURVIVED. Every sweep flow tolerates the signed-out error states;
# this is the flow that holds the real Supabase session, the keychain that persists it, and
# a server read that answers only for an authenticated caller.
#
# Why the security screen: it is in every scaffold, and its read (auth.mfa.listFactors) is
# authenticated. Signed out it renders `security-error`; signed in as the minted identity,
# which enrolls no factor, it renders `security-empty`. So `security-empty` after the
# relaunch can only come from the keychain-persisted token reaching the server — the two
# seams a mocked lane cannot see. The worked example (`init --with-demo`) adds its own
# journey beside this one, which writes a row through the app and proves it persisted.
#
# PRECONDITIONS (the workflow's job): the DEV build is installed, Metro serves the bundle,
# the Supabase stack is up with `adb reverse` mapping the app's 127.0.0.1 ports to the
# runner, and the identity this journey signs in as EXISTS — minted by
# tools/ci/mint-device-user.mjs and handed in as the Maestro flow variables DEVICE_EMAIL /
# DEVICE_PASSWORD (`check-e2e-device.mjs --env`). clearState makes the sign-in deterministic.
appId: {{APP_IDENTIFIER}}
---
- launchApp:
    clearState: true
# The app must be INTERACTIVE before the deep link fires: after clearState the dev build
# re-fetches its bundle from Metro, and a VIEW intent delivered while the router is still
# mounting is dropped. open-actions is the home header leaf that exists in every data
# state, signed-out included — it appearing IS "the router is live".
- extendedWaitUntil:
    visible:
        id: "open-actions"
    timeout: 90000
- openLink: "{{APP_SCHEME}}://sign-in"
- extendedWaitUntil:
    visible:
        id: "sign-in-submit"
    timeout: 60000
# The real form: the minted identity's credentials, typed into the real fields, the real
# submit handler run.
- tapOn:
    id: "sign-in-email"
- inputText: ${DEVICE_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${DEVICE_PASSWORD}
# Enter, NOT hideKeyboard: Maestro's Android hideKeyboard is BACK, which pops sign-in back
# to Home when no IME is up (see the worked example's mutation journey for the dispatch
# that proved it).
- pressKey: Enter
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible:
        id: "home-screen"
    timeout: 60000
- openLink: "{{APP_SCHEME}}://security"
- extendedWaitUntil:
    visible:
        id: "security-empty"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
        id: "open-actions"
    timeout: 90000
- openLink: "{{APP_SCHEME}}://security"
- extendedWaitUntil:
    visible:
        id: "security-empty"
    timeout: 60000
