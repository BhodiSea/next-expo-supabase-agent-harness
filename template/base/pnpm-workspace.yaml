# pnpm-workspace.yaml — workspace layout + THE version catalog.
# Every external version number in this monorepo lives HERE; workspace
# package.json files reference "catalog:" so upgrades are one-line diffs and
# version drift between workspaces is structurally impossible.
#
# The layering law (design/W1-STACK-SPEC.md §2) groups packages into NESTED
# directories — packages/platform/*, packages/verticals/*, packages/shared/*,
# packages/config/* — so the second glob is load-bearing, not decorative. With
# `packages/*` alone, pnpm silently resolves NOTHING under those groups: the
# workspace deps fail to link, `tsc -b` cannot find the projects, and vitest
# collects no suites from them. A missing glob here fails as "package not
# found" three layers away from its cause.
packages:
  - apps/*
  - packages/*
  - packages/*/*

# pnpm 11 skips dependency build scripts unless explicitly approved here
# (`allowBuilds`; the pnpm-10-era key was onlyBuiltDependencies).
allowBuilds:
  esbuild: true
  lefthook: true
  # Next's image optimizer ships a native binary. Without an entry here pnpm
  # skips its install script, and every later `pnpm exec` fails its deps-status
  # check — so the symptom is not "images are slow", it is that the whole gate
  # chain refuses to run.
  sharp: true

# Package-aging protection lives in Renovate (renovate.json minimumReleaseAge
# "5 days": updates age inside a reviewed PR, at the update layer) — NOT in
# pnpm's runtime lockfile verification. Left unpinned, ambient CI policy
# (GitHub hosted runners inject a supply-chain default) re-applies a 24h age
# check per pnpm invocation against a moving wall-clock cutoff: the same
# committed lockfile installs green, then fails `pnpm exec` minutes later
# whenever upstream published <24h before the run (observed live: an Expo
# 57.0.x patch wave reddened the selftest canary job 49 minutes short of the
# cutoff while every earlier pnpm call in the same job passed). Pinning 0
# makes the project's posture explicit and its gate chain deterministic.
minimumReleaseAge: 0

catalog:
  # ---- toolchain --------------------------------------------------------------
  typescript: ~6.0.3 # typescript-eslint 8.63.x supports >=4.8.4 <6.1.0
  tsx: ^4.23.0
  '@biomejs/biome': 2.5.3 # exact: formatter drift would churn the format gate
  eslint: ^9.39.4 # 9.x line: typescript-eslint 8.x peers eslint ^9
  typescript-eslint: ^8.63.0
  eslint-plugin-react-hooks: ^7.1.1 # includes the React Compiler rule set (merged in v6)
  eslint-plugin-react-native: ^5.0.0
  eslint-plugin-react-native-a11y: ^3.5.1
  eslint-plugin-sonarjs: ^4.1.0
  knip: ^6.25.0
  dependency-cruiser: ^18.0.0
  lefthook: ^2.1.10
  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.2.0
  cspell: ^10.0.1
  # ---- test -------------------------------------------------------------------
  vitest: 4.1.10 # exact: @vitest/coverage-v8 peer-pins the identical version
  '@vitest/coverage-v8': 4.1.10
  fast-check: ^4.9.0
  # Mutation testing (CI-only lane; the behavioural net over the critical surface).
  # Exact pins: the runner peer-pins core, and the SET-based ratchet compares mutant
  # identities across runs — a minor bump that renames or adds a mutator would read as
  # "new survivors" and red the lane for no reason. Renovate proposes bumps deliberately.
  '@stryker-mutator/core': 9.6.1
  '@stryker-mutator/vitest-runner': 9.6.1
  # ---- shared backend ----------------------------------------------------------
  # There is no standalone server in this lineage: apps/web hosts the tRPC router
  # at /api/trpc and Supabase Postgres is the data + identity tier. The
  # self-hosted server half (an HTTP framework, a query builder, a migration CLI,
  # a connection pool, a JWT verifier, a logger) left with apps/server.
  zod: ^4.4.3
  '@trpc/server': ^11.8.1
  '@trpc/client': ^11.8.1
  '@tanstack/react-query': ^5.101.2
  '@supabase/supabase-js': ^2.108.0
  '@supabase/ssr': ^0.10.3 # web-only: the cookie-session adapter apps/web satisfies
  supabase: ^2.34.3 # the CLI — local stack, migrations, `gen types` (types-drift gate)
  '@types/node': ^22.20.1 # matches the node >=22 engines floor
  # ---- web ---------------------------------------------------------------------
  next: 16.2.7 # exact: the framework's minor bumps move the App Router contract
  next-safe-action: ^8.5.3
  tailwindcss: ^4.3.0 # v4 CSS-first, WEB ONLY — mobile pins v3 in apps/mobile (see below)
  '@tailwindcss/postcss': ^4.3.0
  '@radix-ui/react-label': ^2.1.6
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  # The web-e2e browser lane (apps/web/e2e, CI-only via tools/check-web-e2e.mjs). Caret so
  # Renovate carries them forward; @playwright/test also gates the browser binaries that
  # `playwright install` fetches, so the pin and the browsers stay in lockstep.
  '@playwright/test': ^1.44.0
  '@axe-core/playwright': ^4.9.0 # the only browser-side axe a11y net in the harness
  # ---- mobile -----------------------------------------------------------------
  # react/react-dom exact: expo@57's bundledNativeModules expects 19.2.3 —
  # `expo install --check` (the native-deps gate) reds any drift, so the
  # catalog mirrors it verbatim (same doctrine as react-native below).
  # ONE React pin serves BOTH surfaces — see design/W1-STACK-SPEC.md §6. Expo 57's
  # bundledNativeModules requires exactly 19.2.3 (`expo install --check`, the
  # native-deps gate, reds on any drift) and Next 16 requires ^19.2.0, which 19.2.3
  # satisfies. Keeping one pin is what makes this file's opening claim — that
  # version drift between workspaces is structurally impossible — literally true
  # rather than a carve-out that turns the header into a lie.
  #
  # ACCEPTED COST: Next's React floor now gates the Expo SDK upgrade cadence in both
  # directions. A future Next major demanding a React that Expo has not yet bundled
  # forces a deliberate decision (hold the upgrade, or split the pin and amend the
  # doctrine above) instead of a silent divergence. `version-sync` carries a
  # single-React-instance assertion — SCOPED PER SURFACE, so it verifies this single
  # pin today yet would tolerate a deliberate split — so two copies cannot coexist
  # undetected within one bundle, where two Reacts break the hooks dispatcher.
  react: 19.2.3
  react-dom: 19.2.3 # web (Next) + the Expo web preview via react-native-web
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  # Expo SDK 57 line. Since SDK 55 every expo-* package's MAJOR tracks the SDK
  # number, so the whole set rides one ~57 line and upgrades move together
  # (design record: EXPO-FACTS; pins verified against expo@57.0.9's own
  # bundledNativeModules.json 2026-08-01).
  expo: 57.0.9 # exact: version-sync's exact-pin set (expo/expo-router/react-native/babel-preset-expo)
  expo-constants: ~57.0.6
  expo-crypto: ~57.0.1 # CSPRNG for the LargeSecureStore AES key (native module, no config plugin)
  expo-haptics: ~57.0.1 # the one haptics door (src/lib/haptics.ts): selection/success/warning vocabulary, wired only into PressableScale + Toast
  expo-linking: ~57.0.3
  expo-localization: ~57.0.1
  expo-router: 57.0.9 # exact: version-sync's exact-pin set
  expo-secure-store: ~57.0.1 # holds the AES key; the ciphertext lives in AsyncStorage (SecureStore caps value size)
  expo-splash-screen: ~57.0.4
  # Kept for `expo-sqlite/kv-store` ONLY — the one SYNCHRONOUS key-value seam
  # (src/lib/kv.ts). Nothing here opens a SQL database: the data tier is Supabase
  # Postgres. The sync API is the point (an async read cannot serve a render pass
  # without a flash of empty state), which is why AsyncStorage does not replace it.
  expo-sqlite: ~57.0.1
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.1 # backs userInterfaceStyle (root view background / appearance) — required for the automatic light/dark surface on Android
  # expo-updates is deliberately NOT in the base catalog: OTA machinery must not
  # ride into every install — the eas-update opt-in module adds the dep (and
  # knip.json carries the matching ignoreDependencies entry until then).
  expo-web-browser: ~57.0.1 # the auth-session browser surface; its config plugin is a no-op without props, so it is NOT in app.config plugins
  babel-preset-expo: 57.0.3 # exact: version-sync's exact-pin set
  # EXACT, not `~`: jest-expo declares `@react-native/jest-preset` as a
  # NON-optional peer, and a floating patch silently RAISES that floor. 57.0.2 →
  # 57.0.3 moved it ^0.86.0 → ^0.86.2, and because the scaffold ships no lockfile
  # (CI installs with --no-frozen-lockfile) that landed on a green tree overnight
  # and killed the mobile jest lane at preset load. Bump this deliberately, with
  # the peer below and the react-native pin, as one reviewed move.
  jest-expo: 57.0.3
  # jest-expo's non-optional peer. react-native pins it EXACTLY to its own version
  # (RN 0.86.2 → "0.86.2"), so this tracks react-native, not the expo line.
  '@react-native/jest-preset': 0.86.2
  # react-native + native companions: pinned exactly as expo@57's own
  # bundledNativeModules.json expects them — `expo install --check` (the
  # native-deps gate) reds drift, so the catalog mirrors its ranges verbatim.
  react-native: 0.86.2
  react-native-safe-area-context: ~5.7.0
  react-native-screens: 4.26.0 # exact: bundledNativeModules pins it exact
  react-native-svg: 15.15.4 # exact: bundledNativeModules pins it exact; one-door'd to src/components/icons (the closed glyph set)
  '@react-native-async-storage/async-storage': 2.2.0 # exact: bundledNativeModules pins it
  aes-js: ^3.1.2 # AES-256-CTR for the SecureStore/AsyncStorage split (LargeSecureStore)
  '@types/aes-js': ^3.1.4 # aes-js ships no types; without this the strict build reds TS7016
  # NativeWind 4 REQUIRES Tailwind v3, while apps/web is on v4. This is the one
  # place two majors of a dependency legitimately coexist in the workspace, and it
  # is why the shared token source (@app/design-tokens) is a framework-neutral TS
  # module rather than a shared tailwind.config or a shared CSS file — neither
  # could be consumed by both majors. The mobile pin lives in apps/mobile's own
  # manifest, NOT in this catalog, because a catalog key holds exactly one version
  # and `tailwindcss` here is the web's v4.
  nativewind: ^4.2.6
  react-native-css-interop: ^0.2.6 # must resolve to ONE path from both the DS-native package and apps/mobile, or cssInterop's registry splits and every className silently no-ops
  # jest-expo 57 is a jest-29 preset (its babel-jest/@jest/* internals are ^29);
  # jest 30 would split the runner and the preset internals across majors.
  jest: ~29.7.0
  '@types/jest': ^29.5.14
  # >= 13.2 per expo-router/testing-library. 14.x swaps the react-test-renderer
  # peer for the new `test-renderer` package — that migration is a deliberate
  # later bump, not a Renovate drive-by.
  '@testing-library/react-native': ~13.3.3
  react-test-renderer: 19.2.3 # exact: RTL's ensure-peer-deps demands react === react-test-renderer (equal to the react pin above)
  # Hermes Intl gaps (EXPO-FACTS): PluralRules/RelativeTimeFormat/Locale are
  # polyfilled unconditionally in apps/mobile/src/i18n/polyfills.ts.
  '@formatjs/intl-getcanonicallocales': ^3.2.11
  '@formatjs/intl-locale': ^5.3.10
  '@formatjs/intl-pluralrules': ^6.3.13
  '@formatjs/intl-relativetimeformat': ^12.3.13
  # ---- harness runtime (root tools/mcp + tests/rls) -----------------------------
  '@modelcontextprotocol/sdk': ^1.29.0
  # postgres.js: dev-only tooling for the rls_verify MCP probe (direct SQL with
  # request.jwt.claims impersonation). The APP never uses it — it reaches the
  # database through supabase-js/PostgREST; this is not shipped in any bundle.
  postgres: ^3.4.5
