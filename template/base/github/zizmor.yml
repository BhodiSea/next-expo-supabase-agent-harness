# zizmor configuration (auto-discovered by zizmorcore/zizmor-action).
# House rule (checked by the workflow-hardening job in actions-lint.yml, since 1.1.0;
# harden-runner-coverage beside it counts): every runnable job starts with
# step-security/harden-runner; on windows-* runners it runs with egress-policy: audit —
# blocking is Linux-only, and an audited Windows job beats an uninstrumented one.
# SOURCE: docs/harness/README.md (workflow linting / CI-for-the-CI)
rules:
  cache-poisoning:
    # Tag-triggered release/attestation workflows configure no dependency cache on the
    # artifact-producing path, so there is no attacker-poisoned cache to taint them:
    #   - release-mobile.yml (ci-mobile-release module)
    #   - provenance.yml (ci-provenance module)
    #   - web-deploy.yml (ci-web-deploy module)
    ignore:
      - release-mobile.yml
      - provenance.yml
      - web-deploy.yml
