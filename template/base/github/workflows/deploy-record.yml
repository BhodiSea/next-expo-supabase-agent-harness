# The deploy-time artefact channel (1.0.0) — the infrastructure two Essential Eight
# families were blocked on, built as three jobs on one file so the emitter and its
# two consumers share a clock and a review surface.
#
#   deploy-record     emits + judges the manifest of WHAT SHIPPED, on the deployment
#                     event itself (deployment_status) — never invented later.
#   patch-window      joins the DEPLOYED resolutions against OSV advisory publication
#                     dates: ASD's verbatim 48-hour / two-week / one-month windows
#                     (PA-06/PA-07/PA-10) and no invented ones. Scheduled + dispatch,
#                     never a PR blocker — the judgement is clockful and network-bound
#                     BY SUBJECT, the exact property that bars it from `pnpm validate`.
#   restore-manifest  binds the platform's backup fact to the latest deploy manifest —
#                     the RB-02 shape (data + applications + settings at a common
#                     point in time), with the verified exclusions carried IN the
#                     artefact so a restore drill reads them before discovering them.
#
# HONEST RESIDUAL, stated where the lane lives: a deploy performed OUTSIDE this
# channel (a console click, a CLI push from a laptop) emits nothing and is invisible
# here — the register grades these rows alternate-control with assessorMayRefuse for
# exactly that reason. Wiring the deployment_status event is the consumer's act:
# Vercel and EAS both emit it via their GitHub integrations; repository_dispatch is
# the escape hatch for any deployer that does not.
name: deploy-record

on:
  deployment_status:
  schedule:
    # Daily, offset from osv-scan's crons so the two lanes never contend.
    - cron: '41 5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-record]

permissions:
  contents: read

jobs:
  deploy-record:
    name: deploy manifest (what shipped, judged)
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The DEPLOYED commit, not the default branch: a manifest describing a tree
      # that did not ship binds nothing.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      # No install: hashing files and parsing the lockfile need nothing resolved.
      - name: Emit the judged deploy manifest
        env:
          DEPLOY_COMMIT: ${{ github.event.deployment.sha || github.sha }}
          DEPLOYED_AT: ${{ github.event.deployment_status.updated_at || github.event.repository.pushed_at || github.event.head_commit.timestamp }}
          DEPLOY_SURFACE: ${{ github.event.deployment.environment || 'manual-dispatch' }}
        run: node tools/emit-deploy-record.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-manifest
          path: artifacts/deploy-manifest.json
          retention-days: 90

  patch-window:
    name: patch windows (ASD 48h / 2w / 1mo, against what is DEPLOYED)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      # The LATEST deploy manifest, across runs: the judgement measures what is
      # deployed, never what main resolves today — an undeployed fix satisfies no
      # window. Absent (no deployment has ever emitted one) → the tool's own loud
      # skip/fail-closed posture decides.
      - name: Fetch the latest deploy manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-record.yml/runs?status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "deployment_status" or .event == "workflow_dispatch" or .event == "repository_dispatch")][0].id' || true)
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" --repo "${{ github.repository }}" --name deploy-manifest --dir artifacts || true
          fi

      - name: Deployed resolutions inside ASD's windows
        run: node tools/check-patch-window.mjs

  restore-manifest:
    name: restore manifest (RB-02 — one point in time, exclusions carried)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Fetch the latest deploy manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-record.yml/runs?status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "deployment_status" or .event == "workflow_dispatch" or .event == "repository_dispatch")][0].id' || true)
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" --repo "${{ github.repository }}" --name deploy-manifest --dir artifacts || true
          fi

      # One HTTPS GET (the backup fact) + the pure binding judgement; the artefact
      # is written only after it passes.
      - name: Bind the backup fact to what shipped
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node tools/check-restore-manifest.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: hashFiles('artifacts/restore-manifest.json') != ''
        with:
          name: restore-manifest
          path: artifacts/restore-manifest.json
          retention-days: 90
