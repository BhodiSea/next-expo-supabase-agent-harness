# CI merge gate. pnpm + Corepack; no native toolchain on the fast jobs. The static job
# runs the SAME validate chain the local Stop hook enforces (tools/validate.mjs) with
# HARNESS_REQUIRE_TOOLCHAINS=1, so a CI pass and a local pass mean the same thing — and
# skips fail closed here. Runtime jobs prove the claims static analysis cannot: live RLS
# isolation against real Postgres, the jest-expo screen suite, the client<->server seam
# over a real server, and — path-filtered + nightly, like every expensive native lane —
# the generated project building (native), the Maestro flows walking the installed app on
# a real emulator (mobile-e2e), and the cold-start budgets measured on-device (perf-lane).
# SOURCE: docs/harness/README.md (CI merge gate; skip-local / fail-closed-CI asymmetry)
name: quality-gate

on:
  pull_request:
  push:
    branches: ['{{DEFAULT_BRANCH}}']
  schedule:
    # Nightly: keeps the path-filtered native job honest between mobile-native PRs.
    - cron: '11 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static floor — the full validate chain, toolchains REQUIRED (no silent skips).
  # expo-policy / native-deps / build all run for real: the expo CLI resolves the
  # config and exports the Hermes bundle on this runner.
  # ---------------------------------------------------------------------------
  static:
    name: static (validate floor)
    runs-on: ubuntu-latest
    env:
      HARNESS_REQUIRE_TOOLCHAINS: '1'
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: the migrations gate diffs against the PR base ref —
          # a shallow clone makes that ref unresolvable and (fail-closed) red.
          fetch-depth: 0

      - name: Enable Corepack (pins pnpm from package.json#packageManager)
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One entrypoint for the whole floor — identical steps to the local Stop hook, with
      # the hardcoded FLOOR merged in so an edited config can never weaken CI.
      # SOURCE: docs/harness/README.md (single validate entrypoint; CI floor)
      - name: Validate (min floor, toolchains required)
        run: node tools/validate.mjs --min-floor

  # ---------------------------------------------------------------------------
  # Unit floor, BOTH runners — vitest (server, packages, pure mobile logic; the
  # rls project self-skips politely here, runtime-rls below runs it for real)
  # then jest-expo (RN components/screens). Both write istanbul maps and the
  # diff-coverage step merges them into ONE per-file floor.
  # ---------------------------------------------------------------------------
  unit:
    name: unit (vitest + jest-expo + diff coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: the diff-coverage step below diffs against the PR
          # base's merge-base — a shallow clone makes that ref unresolvable
          # and (fail-closed) red.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit + contract tests (vitest — server, packages, pure mobile logic)
        run: pnpm exec vitest run --coverage

      - name: RN component/screen tests (jest-expo, with coverage)
        run: pnpm --filter mobile exec jest --coverage --silent

      # Per-file floors on every source file the PR touches, read from the TWO
      # coverage-final.json maps the runs above just wrote — the aggregate
      # thresholds cannot see one untested module inside a green total.
      - name: Diff coverage (merged per-file floors on changed files)
        run: node tools/check-diff-coverage.mjs

      # Copy-paste rot: the same Stop-chain duplication gate an agent runs at
      # turn-end, enforced on the PR.
      - name: Duplication (token clones across apps/*/src + packages/*/src)
        run: node tools/check-duplication.mjs

      # Assertion PRESENCE (the cheap half): no `.only` (it silently disables the whole
      # suite), no disabled tests, no test body without an assertion. The mutation lane
      # below is what actually proves a test would NOTICE a break.
      - name: Test quality (assertions present, nothing focused or disabled)
        run: node tools/check-test-quality.mjs

      # THE TWO STOP STEPS THAT RAN IN NO WORKFLOW (0.3.0). `i18n` and the mobile-perf
      # closure are turn-fatal locally and, until this release, appeared in no CI job at
      # all — so the whole enforcement story for both rested on the agent-time layer alone.
      # An agent that never ran (a human push, a bot commit, a merge from a branch built
      # elsewhere) met neither check, and the PR was green.
      - name: Locale seam (no hardcoded user-facing string; Intl only in src/i18n/)
        run: node tools/check-i18n.mjs

      # Static half of the mobile perf floor: every route in src/routes.ts must have a
      # Maestro flow AND a startup-budget row (and stale rows red). The MEASUREMENT half
      # needs an emulator and lives in perf-lane.
      - name: Mobile perf closure (every route measured and flowed)
        run: node tools/check-mobile-perf.mjs --closure

  # ---------------------------------------------------------------------------
  # MUTATION — the assertion-QUALITY gate, and the only check here that asks the
  # question coverage cannot: change the code, does a test go red?
  #
  # Blocking, and CI-only: a run is minutes, and the warm validate chain measures
  # seconds. Scoped to the CRITICAL files THIS PR touched (tools/mutation-scope.mjs) —
  # auth, the DAL, the error envelope, the route wiring, and the mobile client's
  # auth/transport seam — so the cost is proportional to the change and a docs-only PR
  # pays nothing. The nightly full run over the whole critical surface lives in
  # mutation.yml.
  #
  # The gate is the SET-based ratchet, never a score threshold: a NEW surviving mutant
  # reds; an accepted one is a reviewed, reasoned entry in tools/mutation-baseline.json.
  # ---------------------------------------------------------------------------
  mutation:
    name: mutation (critical files in this diff)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: the scoper diffs against the PR base's merge-base. A shallow
          # clone makes that ref unresolvable — and mutation-scope.mjs FAILS CLOSED there
          # rather than printing an empty list, which would look exactly like "this PR
          # touched nothing critical" and pass forever.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Which critical files does this change touch?
        id: scope
        run: echo "files=$(node tools/mutation-scope.mjs)" >> "$GITHUB_OUTPUT"

      - name: Mutate them (StrykerJS)
        if: steps.scope.outputs.files != ''
        # env indirection, not ${{ }} inside run: file NAMES ride this value, and
        # a branch can name a file almost anything — expanding it into the shell
        # text would make that name executable (zizmor: template-injection).
        env:
          MUTATE_FILES: ${{ steps.scope.outputs.files }}
        run: pnpm exec stryker run stryker.config.mjs --mutate "$MUTATE_FILES"

      # The gate. A survivor the baseline does not accept reds the PR.
      - name: Mutation ratchet (survivors vs the committed baseline)
        if: steps.scope.outputs.files != ''
        run: node tools/check-mutation-ratchet.mjs

      - name: No critical files in this diff — nothing to mutate
        if: steps.scope.outputs.files == ''
        run: echo 'This change touches no file on the critical surface (see tools/lib/mutation-critical.mjs).'

  # ---------------------------------------------------------------------------
  # Runtime RLS — the headline isolation gate against REAL Postgres 16 + pgvector
  # (same digest-pinned image as docker-compose.yml). run-rls.mjs fresh-applies all
  # migrations, then runs the isolation suite; CI=true makes every skip fail closed.
  # The job asserts the literal '[rls] OK' marker so a truncated run cannot green.
  # ---------------------------------------------------------------------------
  runtime-rls:
    name: runtime (rls isolation + pgTAP, real postgres)
    runs-on: ubuntu-latest
    # No `services:` block. The database under test is the Supabase local stack,
    # started by its own CLI below — a bare postgres service container would be a
    # DIFFERENT database from the one the app runs against: no auth schema, no
    # auth.uid(), no GoTrue-issued JWTs, and therefore none of the RLS predicates
    # this job exists to prove. Testing the wrong engine green is worse than not
    # testing it.
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Supabase CLI is a catalog-pinned devDependency, so it lives in
      # node_modules/.bin — which a `run:` step's PATH does not include (only
      # package-manager script execution adds it). Put it on PATH in its own step
      # ($GITHUB_PATH only affects LATER steps) rather than prefixing each call
      # site: tests/rls/run-rls.mjs spawns `supabase` as a bare command from inside
      # node, so an outer `pnpm exec` would not reach it. Deliberately not
      # supabase/setup-cli — that would float a second, un-catalogued CLI version.
      - name: Put the workspace-local Supabase CLI on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # `supabase start` applies supabase/migrations from scratch, so a migration
      # that cannot fresh-apply fails HERE rather than on someone's next deploy.
      # The stack ships its own postgres, auth schema and GoTrue — the same shape
      # the app authenticates against.
      - name: Start the Supabase local stack
        run: supabase start

      # pgTAP over the RLS STRUCTURE: force-RLS on every table, four per-operation
      # policies, no vacuous `USING (true)`, the initPlan sub-select form, and the
      # owner column leading an index.
      - name: RLS structure (pgTAP)
        run: supabase test db

      # The SDK twin: cross-tenant isolation exercised through a real client with
      # real JWTs. Structure tests prove the policies EXIST and are shaped right;
      # only this proves they DENY.
      - name: RLS isolation suite (cross-tenant matrix)
        shell: bash
        run: |
          node tests/rls/run-rls.mjs 2>&1 | tee rls-output.log
          # Belt and braces: the exit code gates above; the marker proves the runner
          # reached its final line (a wedged/truncated run cannot count as green).
          grep -F '[rls] OK' rls-output.log

      # A migration can land without regenerating the committed types; nothing else
      # in the chain notices until a consumer's typecheck breaks against a stale view
      # of the schema. The stack is up here, so this is the one place it can be proved.
      - name: Generated-types drift
        run: node tools/check-types-drift.mjs

  # ---------------------------------------------------------------------------
  # e2e fast lane — the SAME gate the Stop chain runs (tools/check-e2e.mjs):
  # the whole jest-expo/RNTL suite — states sweep over every ROUTES entry,
  # screen flows, boot/layout, primitives a11y — mocked at the network seam.
  # CI=true means the gate FAILS CLOSED instead of skipping (a runner without
  # jest-expo is a broken lane, never a green one).
  # ---------------------------------------------------------------------------
  e2e-fast:
    name: e2e fast lane (jest-expo screen suite)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: RN screen suite (check-e2e gate — anti-vacuity enforced)
        run: node tools/check-e2e.mjs

  # ---------------------------------------------------------------------------
  # The mobile<->server seam. Every other lane mocks the network, which is how a
  # client ships sending no Authorization header at all while every mocked suite
  # stays green. This lane stubs nothing but the native keystore (no hardware in
  # CI): the app's own auth provider signs in against the REAL Supabase stack, the
  # verified session attaches to each tRPC request, FORCE RLS filters rows, and the
  # app renders real data — the live-api-proof suite under LIVE_PROOF=1.
  # tools/check-e2e.mjs strips these env vars, so this can NEVER run in the
  # agent-time chain.
  # ---------------------------------------------------------------------------
  integration-lane:
    name: integration lane (mobile <-> web-hosted API, real postgres)
    runs-on: ubuntu-latest
    env:
      HARNESS_INTEGRATION_LANE: '1'
      LIVE_PROOF: '1'
      NODE_ENV: development
      # apps/web IS the API host in this lineage, so the lane boots the web app
      # and the mobile client talks to its origin — there is no separate server
      # to start, and the transport under test is the one production uses.
      EXPO_PUBLIC_WEB_ORIGIN: 'http://127.0.0.1:3000'
    # No `services:` block — see runtime-rls above. The stack is the Supabase CLI's.
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See runtime-rls: the catalog-pinned CLI lives in node_modules/.bin.
      - name: Put the workspace-local Supabase CLI on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Starting the stack applies supabase/migrations and seeds deterministically.
      - name: Start the Supabase local stack
        run: supabase start

      - name: Boot the web app (which hosts /api/trpc)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter web run dev > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            # The health PROCEDURE, not the page: a 200 from / proves Next is
            # serving, not that the router mounted and reached the database.
            if curl -fsS -m 2 "http://127.0.0.1:3000/api/trpc/health" > /dev/null; then
              echo "web up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the web app never served a healthy /api/trpc"; cat /tmp/web.log; exit 1

      # The suite authenticates through the real Supabase local stack, so the lane
      # exercises the exact JWT path production does — no token is minted
      # out-of-band, and RLS is live underneath every assertion.
      #
      # Wrapped in the statement-count gate rather than run beside it: `query-budget`
      # resets pg_stat_statements, runs THIS workload, and reads the delta, so what it
      # measures is real traffic through the real transport. An N+1 is a defect of
      # COUNT — every statement individually indexed, a hundred of them per request —
      # and it is invisible to `query-shapes` and `db-perf`, which are per-statement.
      # The counter is filtered to the `authenticator` role so GoTrue/Realtime/Storage
      # traffic is excluded, and the gate refuses to pass on a ZERO count: a budget met
      # by an instrument that is not connected is not a budget.
      - name: Live API proof (app modules against the real API), under a statement budget
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_DB_URL="$DB_URL"
          node tools/check-query-budget.mjs -- pnpm --filter mobile exec jest --silent __tests__/live-api-proof.test.ts

      - name: Web log on failure
        if: failure()
        run: cat /tmp/web.log || true

  # ---------------------------------------------------------------------------
  # Native build lane — the generated android project actually assembles.
  # Expensive, so: per-PR only when the native-affecting surface changed, plus
  # the nightly schedule and manual dispatch as the unconditional net.
  # ---------------------------------------------------------------------------
  changes:
    name: changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile-native: ${{ steps.filter.outputs.mobile-native }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # 4.0.3, not 4.0.2: GHSA-7hc6-8hq5-9q2m (HIGH, published 2026-08-05, fixed the same
      # day) — a changed filename containing LF/CRLF bypassed the `list-files: shell`
      # escaping, because both allowlist regexes used JavaScript multiline mode, so `^`/`$`
      # matched a LINE boundary instead of the whole value. On `pull_request_target` a pull
      # request author controls the filenames while the workflow comes from the trusted base
      # branch, so the injected second line runs with the job's secrets. Affected ranges are
      # `>= 2.7.0, < 3.0.4` and `>= 4.0.0, < 4.0.3`; the pin below was v4.0.2, inside the
      # second one. THIS TREE WAS NOT EXPLOITABLE — exploitation needs `list-files: shell`
      # and no workflow here sets it, at this call site or any other — so the bump closes a
      # reachable-later hole rather than a live one, which is exactly when it is cheap.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mobile-native:
              - 'apps/mobile/app.config.ts'
              - 'apps/mobile/eas.json'
              - 'apps/mobile/package.json'
              - 'apps/mobile/plugins/**'
              - 'apps/mobile/assets/**'
              - 'tools/expo-plugins.json'
              - 'tools/expo-permissions.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # The device lanes (mobile-e2e + perf-lane): anything that changes what the
            # installed app IS, what the flows assert, or what the budgets enforce.
            mobile:
              - 'apps/mobile/**'
              - 'maestro/**'
              # The packages that ship INSIDE the installed app. Their absence was the
              # defect: `apps/mobile` imports @app/contracts 27 times, and a change to it
              # skipped BOTH device lanes until the nightly — while the sibling `web`
              # filter enumerated its package set and the `db` filter included
              # packages/verticals/**. A filter that omits what the binary is made of
              # reports "no mobile change" about a changed mobile app.
              #
              # Derived from what apps/mobile actually reaches, not copied from `web`:
              # packages/design-system/** is DELIBERATELY absent, because
              # dependency-cruiser rule `mobile-not-into-web-only` makes importing it an
              # error — a filter arming a 120-minute lane on a package the app may not
              # import is a lane nobody thanks you for.
              - 'packages/contracts/**'
              - 'packages/design-tokens/**'
              - 'packages/platform/errors/**'
              - 'packages/platform/supabase/**'
              # Type-only for Metro (devDependency, `import type`), but the tRPC contract
              # it declares is what the screens call — a shape change moves the app.
              - 'packages/api/**'
              # `packages/verticals/**`, not the seeded `notes` by name, for the reason
              # the `web` and `db` filters already give: a consumer's SECOND vertical is
              # mobile-reachable through its `./client` the day it lands.
              - 'packages/verticals/**'
              # The mobile half of the design system. The seeded exemplar styles through
              # `useThemedStyles` over tokens and does not import this yet, so today this
              # entry is forward-looking rather than load-bearing — but a consumer's
              # screens do import it, and the Maestro flows assert on what it paints.
              - 'packages/design-system-native/**'
              - 'tools/startup-budget.json'
              - 'tools/interaction-budget.json'
              - 'tools/identity.lock.json'
              - 'tools/check-e2e-device.mjs'
              - 'tools/measure-startup.mjs'
              - 'tools/gen-maestro-flows.mjs'
              - 'tools/lib/maestro-flows.mjs'
              - 'tools/lib/mobile-app-meta.mjs'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # The browser lane (web-e2e): the web app, the packages it bundles
            # (next.config transpilePackages), the lane runner + its specs, and the
            # lockfiles. Disjoint from apps/mobile, so a mobile-only PR skips this lane.
            web:
              - 'apps/web/**'
              - 'packages/api/**'
              - 'packages/contracts/**'
              - 'packages/design-system/**'
              - 'packages/design-tokens/**'
              - 'packages/platform/errors/**'
              - 'packages/platform/supabase/**'
              # `packages/verticals/**`, not the seeded `notes` package by name. A
              # consumer's SECOND vertical is web-reachable the day it lands, and a filter
              # naming only the exemplar would silently stop running the browser lane for
              # it — a lane that skips is a lane a reviewer reads as passing. The sibling
              # `db` filter already got this right.
              - 'packages/verticals/**'
              - 'tools/check-web-e2e.mjs'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # The scale lane (db-scale): anything that can change a PLAN. The schema and
            # its indexes, the DALs whose statements the manifest records, the manifest
            # and probe machinery, the seed that supplies the cardinality, and the
            # budgets. Deliberately NOT `apps/**` — a component edit cannot move a plan,
            # and a lane that runs on every PR is a lane somebody turns off.
            db:
              - 'supabase/**'
              - 'packages/verticals/**'
              - 'tools/generated/query-shapes.json'
              - 'tools/gen-query-shapes.mjs'
              - 'tools/check-query-shapes.mjs'
              - 'tools/check-db-perf.mjs'
              - 'tools/db-perf-baseline.json'
              - 'tools/tenancy.json'
              - 'tools/db-limits.json'
              - 'tools/lib/query-shapes.mjs'
              - 'tools/lib/query-recorder.mjs'
              - 'tools/lib/sql-parse.mjs'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # ---------------------------------------------------------------------------
  # db-scale — the PLAN probe, and the only lane in this file that can falsify the
  # claim the whole tenancy design rests on: that `org_id = ANY(<InitPlan uuid[]>)`
  # with the list screen's keyset order is an ORDERED INDEX SCAN.
  #
  # It needs cardinality no other lane has. Every structural check in this repo —
  # pgTAP's leading-column assertion, `schema-rls`, `tenancy`, `query-shapes` — is
  # true of a two-row table, and the planner correctly ignores an index on one.
  # So this lane seeds two million rows, ANALYZEs, and asserts plan SHAPE under
  # real RLS impersonation. Minutes, not seconds: hence the path filter, plus the
  # nightly schedule and manual dispatch as the unconditional net.
  #
  # The proof that it is not redundant: rewrite a policy predicate as
  # `org_id::text = $1::text` and every other lane in this file stays green while
  # every query in the product becomes a sequential scan.
  # ---------------------------------------------------------------------------
  db-scale:
    name: db scale (2M rows, EXPLAIN plan shape under live RLS)
    needs: [changes]
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.db == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # ADOPTION, not a skip switch — and it runs BEFORE `pnpm install` so a pre-0.2.0
      # install spends seconds here, not minutes.
      #
      # The seed and the plan budgets are seedOnInitOnly: an install that predates 0.2.0
      # gets this workflow (it is harness-OWNED, so `update` ships it) without the files
      # it drives, and `psql -f` on a missing file is a red lane about a feature the tree
      # does not have. So the lane asks the one record an agent cannot rewrite for free —
      # .harness/manifest.json's baseVersion, which check-gate-integrity checks against
      # git history and never lets regress.
      #
      # The asymmetry is what keeps this from being a hole. A pre-0.2.0 baseVersion may
      # skip; a 0.2.0+ install MUST carry all three files, so deleting the seed to quiet
      # the lane FAILS here instead. Adoption is a version fact, not a missing file.
      - name: Adoption gate — does this install carry the 0.2.0 scale surface?
        id: adoption
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -e "try{const v=JSON.parse(require('fs').readFileSync('.harness/manifest.json','utf8')).baseVersion;process.stdout.write(v?String(v):'0.0.0')}catch{process.stdout.write('0.0.0')}")"
          # exit 0 == "base is OLDER than 0.2.0". Field-wise NUMERIC compare, so 0.10.0
          # sorts above 0.2.0 — a string compare gets that backwards.
          if node -e "const p=String(process.argv[1]).split('.'),q=[0,2,0];for(let i=0;i<3;i++){const a=Number(p[i])||0;if(a!==q[i])process.exit(a<q[i]?0:1)}process.exit(1)" "$base"; then
            echo "::notice::db-scale: baseVersion $base predates 0.2.0 — the scale seed and plan budgets are seedOnInitOnly and were not planted. Adopt with \`update --refresh-seeded supabase/seeds/\` and \`update --refresh-seeded tools/db-perf-baseline.json\`, then graduate baseVersion (docs/runbooks/harness-upgrade.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for f in supabase/seeds/scale.sql tools/db-perf-baseline.json tools/generated/query-shapes.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::db-scale: baseVersion $base has adopted the 0.2.0 scale surface but these file(s) are missing:$missing — this lane is the only check in the repo that can falsify the ordered-index-scan claim the tenancy design rests on, and a lane that quietly skips it proves nothing."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.adoption.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # See runtime-rls: the catalog-pinned CLI lives in node_modules/.bin.
      - name: Put the workspace-local Supabase CLI on PATH
        if: steps.adoption.outputs.run == 'true'
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Start the Supabase local stack
        if: steps.adoption.outputs.run == 'true'
        run: supabase start

      # The scale seed refuses any database that is not loopback (statement 1 is an
      # inet_server_addr() guard raised database-side, so no shell spelling dodges it).
      # `supabase status -o env` is where the local URL comes from — never a literal.
      - name: Seed at scale and probe the plans
        if: steps.adoption.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_DB_URL="$DB_URL"
          time psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seeds/scale.sql
          node tools/check-db-perf.mjs

  native:
    name: native (prebuild determinism + expo-doctor + gradle assembleDebug)
    needs: [changes]
    # Runs when: nightly/dispatch (always), or a PR that touched the native surface.
    # `!cancelled()` lets it run even though `changes` is skipped outside PRs.
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.mobile-native == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # RN 0.86's supported JDK (design record: CI-LANE-FACTS — "you may
      # encounter problems using higher JDK versions").
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prebuild DETERMINISM: CNG's whole promise is that android/ is a pure
      # function of app.config.ts + the config plugins + the SDK. Run it twice
      # and hash the trees — a nondeterministic plugin (a timestamp, a random
      # id) breaks the promise and every future config review with it.
      # SDK 57 prebuild clears + regenerates by default (CI-LANE-FACTS).
      - name: Prebuild x2 + tree hash (CNG determinism)
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          hash_tree() {
            find android -type f ! -path '*/.gradle/*' -print0 | sort -z \
              | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
          }
          npx expo prebuild -p android --no-install
          h1="$(hash_tree)"
          npx expo prebuild -p android --no-install
          h2="$(hash_tree)"
          echo "prebuild tree hashes: $h1 / $h2"
          if [ "$h1" != "$h2" ]; then
            echo "::error::expo prebuild is nondeterministic — two consecutive runs produced different android/ trees; find the plugin injecting run-dependent content"
            exit 1
          fi

      # Network-dependent by design (SDK versions endpoint + the RN directory) —
      # which is exactly why the hermetic native-deps gate does not run it and
      # this lane does.
      - name: expo-doctor
        working-directory: apps/mobile
        run: npx expo-doctor

      # The REAL targetSdk is a gradle fact only prebuild can materialize — the
      # expo-policy gate's pre-prebuild check (declared value or the pinned
      # per-SDK default in tools/store-policy.json) closes here against the
      # generated project: Play rejects new builds targeting stale API levels.
      - name: targetSdk floor (the generated project vs tools/store-policy.json)
        run: |
          floor="$(node -p "require('./tools/store-policy.json').androidTargetSdk.floor")"
          target="$(grep -rhoE 'targetSdkVersion\s*=?\s*[0-9]+' apps/mobile/android --include=build.gradle --include=gradle.properties --include='*.gradle' | grep -oE '[0-9]+' | sort -n | tail -1)"
          echo "generated targetSdkVersion: ${target:-<none>} (floor ${floor})"
          if [ -z "$target" ] || [ "$target" -lt "$floor" ]; then
            echo "::error::generated android project targets SDK '${target:-none}', below the Play floor ${floor} (tools/store-policy.json) — Play rejects new builds targeting stale API levels"
            exit 1
          fi

      - name: Gradle assembleDebug (the generated project actually builds)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

  # ---------------------------------------------------------------------------
  # mobile-e2e — the Maestro device lane: the installed binaries walked on a real
  # Android emulator. Path-filtered + nightly like the native job (emulators are
  # expensive), and TWO installs, deliberately:
  #
  #   RELEASE half (no credentials — the EXPO_PUBLIC_SUPABASE_* values come from
  #   the LOCAL stack via `supabase status`, so the binary boots to its signed-out
  #   surfaces against a real backend and no committed key is involved; the dev stub
  #   stays __DEV__-only and this lane must never weaken that): the per-route
  #   flows, the generated route sweep, then the sweep re-run under a flipped OS
  #   theme (the store's `system` preference tracks Appearance live) and under
  #   font_scale 1.3 — minified Hermes bytecode is where Fabric view flattening
  #   actually detaches careless testIDs, which is exactly what this half proves.
  #
  #   DEV half (Metro on the runner, adb reverse): the flows a release binary
  #   cannot run — the kv store is PRE-SEEDED (push + run-as into the debuggable
  #   build's expo-sqlite kv database) so the app BOOTS in ar-XB/RTL for the i18n
  #   journey; the mutation flow signs in through the stub screen and proves a
  #   created note survives a relaunch against the real server + Postgres; and
  #   the perf-harness journey asserts the dev screen's self-measured perf-pass
  #   marker against tools/interaction-budget.json.
  #
  # Maestro install is the SHA-verified cli-2.6.1 zip (the official install
  # script does NOT verify checksums — never use it in CI); emulator is the
  # api-33 aosp_atd x86_64 fast lane with the KVM udev rule and AVD caching
  # (design record: CI-LANE-FACTS).
  # ---------------------------------------------------------------------------
  mobile-e2e:
    name: mobile e2e (maestro device lane)
    needs: [changes]
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: development
      # The device lane drives a real emulator against the real API host. See
      # runtime-rls for why there is no postgres service container.
      EXPO_PUBLIC_WEB_ORIGIN: 'http://127.0.0.1:3000'
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # RN 0.86's supported JDK (design record: CI-LANE-FACTS).
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Checksum-verified Maestro (cli-2.6.1). Never the official install script:
      # it does not verify what it downloads (design record: CI-LANE-FACTS).
      - name: Install Maestro CLI (pinned zip, sha256-verified)
        run: |
          curl -fsSL -o maestro.zip https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.6.1/maestro.zip
          echo "3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME/.maestro-dist"
          echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"

      # See runtime-rls: the catalog-pinned CLI lives in node_modules/.bin.
      - name: Put the workspace-local Supabase CLI on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Start the Supabase local stack
        run: supabase start

      - name: Boot the web app (the mutation flow's backend)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter web run dev > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -m 2 "http://127.0.0.1:3000/api/trpc/health" > /dev/null; then
              echo "web up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the web app never served a healthy /api/trpc"; cat /tmp/web.log; exit 1

      # The device reaches the host through adb reverse, so the app's public config
      # must point at loopback. `supabase status -o env` is the source for the local
      # stack's URL and publishable key — never a committed literal (the hygiene gate
      # rejects JWT-shaped strings in the template, and these rotate per `supabase start`).
      - name: Publish the local Supabase env for the bundle
        run: |
          eval "$(supabase status -o env)"
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${API_URL%/}"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE=${ANON_KEY}"
            echo "EXPO_PUBLIC_WEB_ORIGIN=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      # Both binaries up front (the emulator step below only installs + drives).
      # Release: EXPO_PUBLIC_ vars are inlined at BUNDLE time, so they must be set on
      # the gradle step, not on the device.
      - name: Prebuild + assemble (release for the sweeps, debug for the dev half)
        working-directory: apps/mobile
        run: |
          npx expo prebuild -p android --no-install
          cd android
          ./gradlew assembleRelease assembleDebug

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-aosp-atd-x86_64

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Device lane (flows + sweeps + journeys on the emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/ci/device-lane.sh
      - name: Server + Metro logs on failure
        if: failure()
        run: |
          echo '::group::server.log'; cat /tmp/server.log || true; echo '::endgroup::'
          echo '::group::metro.log'; cat /tmp/metro.log || true; echo '::endgroup::'

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-evidence
          path: artifacts/maestro/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # perf-lane — the startup MEASUREMENT half of the mobile-perf floor (the
  # --closure half runs in the Stop chain). Release binary only, its own quiet
  # emulator (wall clock must not share a CPU with Metro or a server):
  # tools/measure-startup.mjs cold-starts every ROUTES entry via
  # `am force-stop` + `am start -W <scheme>://<path>` and writes
  # artifacts/perf-results.json; then HARNESS_PERF_LANE=1 check-mobile-perf
  # enforces tools/startup-budget.json and FAILS CLOSED if the artifact is
  # missing — a mis-wired lane can never skip-green.
  # ---------------------------------------------------------------------------
  perf-lane:
    name: perf lane (device startup budgets)
    needs: [changes]
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild + assembleRelease
        working-directory: apps/mobile
        env:
          # Boot-shape dummies, NOT credentials. This lane measures COLD START, so it
          # never talks to a backend and starts no Supabase stack — but the public
          # config must still be syntactically valid or the release binary fails its
          # configuration check before the first frame and measures nothing. A
          # publishable-shaped placeholder is safe by construction: the client factory
          # REFUSES a secret key, and row-level security is the access boundary anyway.
          EXPO_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE: 'sb_publishable_perf_lane_placeholder'
          EXPO_PUBLIC_WEB_ORIGIN: 'http://127.0.0.1:3000'
        run: |
          npx expo prebuild -p android --no-install
          cd android
          ./gradlew assembleRelease

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-aosp-atd-x86_64

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Measure cold starts + enforce startup budgets
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/ci/perf-lane.sh
      - name: Upload measured startup numbers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-results
          path: artifacts/perf-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Web browser lane — the ONLY browser-side axe accessibility sweep in the chain
  # (the mobile a11y net is lint + RNTL, neither of which sees the DOM). Playwright
  # exits 0 on an empty run, so the lane invokes tools/check-web-e2e.mjs, which fails
  # closed on a missing config, an empty suite, an assertion-free spec, or a spec set
  # with no axe scan BEFORE handing off to the browser. Path-filtered (web arm) + the
  # nightly/dispatch net, like the device lanes — expensive, and irrelevant to a
  # mobile-only PR. Playwright's own webServer runs a PRODUCTION build (`next build
  # && next start`) — see playwright.config.ts, where the CSP suite is the reason —
  # so the job must NOT pin NODE_ENV; the local Supabase env is exported at runtime
  # so no publishable key is committed, and the service-role key is exported too
  # because the authenticated-render spec mints its own fixture identity.
  # ---------------------------------------------------------------------------
  web-e2e:
    name: web e2e (playwright + axe browser lane)
    needs: [changes]
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NO `NODE_ENV: development` HERE, and it is not an omission — it was here, and it made
    # this job impossible to pass. Playwright's webServer runs `pnpm run build && pnpm run
    # start`, and `next build` under NODE_ENV=development FAILS: it prerenders the error
    # boundaries against React's development resolution and dies with `Cannot read properties
    # of null (reading 'useContext')` before a single spec runs. Same tree, same env, only
    # that variable differing — exit 1 with it, exit 0 without. It was a leftover from when
    # the webServer booted `next dev`, and it survived the switch to a production build
    # because this job is path-filtered and nightly, so nothing here ever executed it.
    # `NODE_ENV` stays UNSET so the toolchain sets it: `next build` means production.
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See runtime-rls: the catalog-pinned CLI lives in node_modules/.bin.
      - name: Put the workspace-local Supabase CLI on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Start the Supabase local stack
        run: supabase start

      # The landing route reaches the auth server (getVerifiedUser), and the browser
      # bundle parses the NEXT_PUBLIC_* env, so the local URL + publishable key must be
      # present. Extract them from the running stack at runtime — never a committed key
      # (the hygiene gate rejects JWT-shaped strings in the template anyway). API_URL has
      # its trailing slash stripped: the env Origin validator rejects one.
      - name: Publish the local Supabase env to the job
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL%/}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE=${ANON_KEY}"
            echo "NEXT_PUBLIC_WEB_ORIGIN=http://127.0.0.1:3000"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=${DB_URL}"
          } >> "$GITHUB_ENV"

      - name: Install Chromium (+ OS deps)
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The runner enforces the non-vacuous, axe-bearing closure, then runs the suite;
      # Playwright's webServer boots `next dev` against the stack above.
      - name: Web browser lane (closure + playwright + axe)
        run: node tools/check-web-e2e.mjs

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # The WEB half of the `build` gate (0.5.0). docs/harness/enforcement-tiers.md carried
  # `build … Target 0.5.0` with the reason in the row: the chain's build gate is
  # `const APP = 'apps/mobile'`, so the impure-import and secret-shaped-string scan never
  # saw the web bundle — while docs/security/sandbox-and-supply-chain.md claimed the build
  # gate greps the exported bundle, without qualification. Two shipped documents
  # contradicting each other on a secret-exfiltration control, and the one a security
  # reviewer opens was the one that overstated.
  #
  # A JOB RATHER THAN A CHAIN STEP, for the reason the tier row itself gave: a `next build`
  # is minutes, not seconds, and the validate chain is held to a wall-clock budget
  # (scripts/chain-budget.json). Path-filtered on `web` so it does not run on a mobile-only
  # PR — and the tier row now SAYS "(path-filtered)", because a control that skips is not
  # a control that ran.
  #
  # It scans `.next/static/**` only: `.next/server/**` legitimately contains the
  # service-role factory and every server-only import, so scanning it would red on correct
  # code. `static` is what a browser downloads, so a forbidden marker there is a leak.
  web-build:
    name: web build (client-bundle purity)
    needs: [changes]
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `next build` parses BOTH env schemas at build time and fails without either. The
      # public half is obvious; the SERVER half is not, and the first real run of this lane
      # is what found it — `Collecting page data` imports the tRPC route, which imports
      # @app/env, which parses once at startup and refuses a partial environment:
      #   Error: @app/env: the server-only (secrets) environment is invalid
      #     SUPABASE_DB_URL: Invalid input
      #     SUPABASE_SERVICE_ROLE_KEY: Invalid input
      # So the job has to publish something for those two, and an earlier version of this
      # comment claimed the opposite was the proof: "no secret key is published to this job
      # at all — if a service-role key ever appears in a client chunk, it cannot have come
      # from this job's environment." That argument was free, and it was also unavailable,
      # because the build cannot run without them.
      #
      # THE VALUES ARE PLACEHOLDER-SPELLED, AND THAT COSTS SOMETHING — say it plainly. The
      # first draft spelled them so the purity scan below would CATCH them if they ever
      # reached a client chunk, which meant avoiding the `example|placeholder|…` vocabulary
      # that build-check.mjs and gitleaks.toml exempt. That draft was rejected by this
      # repository's own `secrets` gate within the minute: a key-shaped string in a TRACKED
      # file is a finding, and the gate's remedy text says exactly what to do — "prefer
      # making the VALUE say so". Two controls wanted opposite spellings, and the one that
      # scans committed files outranks the one that scans build output, because a real key
      # pasted into a workflow is the likelier accident by a wide margin.
      #
      # So: this job does NOT prove that these particular values stayed out of the client
      # bundle — the scan's placeholder allowlist would excuse them. What it proves is that
      # the scan RUNS against real `next build` client output and reds on a key-shaped
      # value planted there, which is the property the lane exists for and which
      # tests/gates/build-check-web.test.mjs pins in both directions.
      - name: Build the web app
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE: sb_publishable_build_time_placeholder
          NEXT_PUBLIC_WEB_ORIGIN: http://127.0.0.1:3000
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_build_time_placeholder_do_not_use
          # The DSN is the CLI's standard loopback string, not an invented one. A
          # credentialed DSN with any other password is a leaked-string finding in this
          # repository's own `hygiene` and `secrets` gates — which is how the first draft of
          # this line was caught, by the harness scanning itself. It still begins
          # `postgresql://`, so it remains on the forbidden list the scan below applies.
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter web build

      - name: Client-bundle purity (.next/static)
        run: node tools/build-check.mjs --web

  # ---------------------------------------------------------------------------
  # THE ONE CHECK AN ENTERPRISE CAN MARK REQUIRED.
  #
  # This workflow runs thirteen jobs and several are path-filtered, so a branch
  # protection rule had to either enumerate every job by name — a list that goes
  # stale the day a job is added or renamed, silently, with the branch still
  # "protected" — or mark none of them. Neither is a control.
  #
  # `needs:` over every other job plus `if: always()` makes this the fan-in. The
  # verdict is delegated to tools/ci/summarize-gate.mjs rather than written as a
  # YAML expression, because a `contains(needs.*.result, 'failure')` expression is
  # untestable prose: nobody can run it, and its most important behaviour — what it
  # does with a SKIPPED lane — is exactly where this kind of check goes wrong.
  # `if: always()` makes a skipped need indistinguishable from a passed one, which
  # would recreate the silent-skip problem INSIDE the check a reviewer trusts most.
  # The script records every skipped lane by name on the green path, so a green
  # gate-summary shows precisely which lanes did not run.
  #
  # An EMPTY needs context is a FAILURE, not a pass: that is what a broken `needs:`
  # list produces, and a summary over nothing proves nothing.
  # ---------------------------------------------------------------------------
  gate-summary:
    name: gate-summary (mark THIS one required)
    if: always()
    needs:
      - static
      - unit
      - mutation
      - runtime-rls
      - e2e-fast
      - integration-lane
      - changes
      - db-scale
      - native
      - mobile-e2e
      - perf-lane
      - web-e2e
      # 0.5.0. A new lane that is not in this list is a lane the one required check does
      # not wait for — it can fail after gate-summary has already reported green, which is
      # the failure mode this fan-in exists to make impossible.
      - web-build
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Summarize every lane (a skip is recorded, never a pass)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/summarize-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
