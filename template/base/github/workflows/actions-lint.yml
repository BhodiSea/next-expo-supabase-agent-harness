# Lint the CI itself: actionlint (workflow syntax + shellcheck on run: blocks) and
# zizmor (workflow security audit — pin hygiene, untrusted inputs, credential exposure).
# House rule: EVERY job starts with harden-runner, and on `windows-*` runners it uses
# `egress-policy: audit` (the agent cannot block egress on Windows — an audit entry is
# honest; a silently absent sensor is not). Since 1.1.0 the `workflow-hardening` job below
# checks that rule by position, with the workflow-level bash default and a ceiling on every
# job, over every workflow in this directory; `harden-runner-coverage` still counts.
# SOURCE: docs/harness/README.md (workflow linting / CI-for-the-CI)
name: actions-lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'tools/check-workflow-hardening.mjs'
      - 'tools/lib/workflow-hardening.mjs'
      - '.harness/manifest.json'
  push:
    branches: ['{{DEFAULT_BRANCH}}']
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'tools/check-workflow-hardening.mjs'
      - 'tools/lib/workflow-hardening.mjs'
      - '.harness/manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` step under bash -eo pipefail. A step that names no shell runs as `bash -e`,
# WITHOUT pipefail, so `producer | tee file` reports tee's status and the producer's
# failure is swallowed. Selecting the shell here closes that for the whole workflow.
defaults:
  run:
    shell: bash

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: zizmor (workflow security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # Fail the job on findings instead of uploading SARIF — works without GitHub
          # Advanced Security. Flip to true to feed the Security tab (needs
          # security-events: write on this job and GHAS on private repos).
          advanced-security: false

  harden-runner-coverage:
    name: harden-runner coverage (incl. audit-on-windows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Grep-level coverage of the house rule, and it COUNTS: per `*.yml` file, the
      # harden-runner lines must be at least the runnable jobs (the `runs-on:`/`uses:`
      # lines at four spaces, less reusable-workflow calls and self-hosted jobs). A count
      # cannot see position, which job a line belongs to, a comment, a `.yaml` file, a
      # workflow indented another way, or `egress-policy`; since 1.1.0 the
      # `workflow-hardening` job below checks each of those. This loop keeps its id, name
      # and verdict. Exempt here as there: reusable-workflow call jobs (`uses:` jobs have
      # no steps of their own) and self-hosted jobs (the agent targets GitHub-hosted VMs;
      # egress control on self-hosted boxes belongs to their host firewall).
      - name: Every job carries harden-runner
        shell: bash
        run: |
          status=0
          for wf in .github/workflows/*.yml; do
            jobs_total=$(grep -cE '^    (runs-on|uses):' "$wf" || true)
            hardened=$(grep -c 'step-security/harden-runner@' "$wf" || true)
            reusable=$(grep -cE '^    uses: .+/\.github/workflows/' "$wf" || true)
            self_hosted=$(grep -cE '^    runs-on: \[?\s*self-hosted' "$wf" || true)
            expected=$((jobs_total - reusable - self_hosted))
            if [ "$hardened" -lt "$expected" ]; then
              echo "::error file=$wf::$wf declares $expected runnable job(s) but only $hardened harden-runner step(s) — add harden-runner (egress-policy: audit on windows-*) as the first step of every job"
              status=1
            fi
          done
          exit "$status"

  # THE HOUSE RULES OVER THIS PROJECT'S OWN WORKFLOWS (1.1.0). tools/check-workflow-hardening.mjs
  # holds every workflow here, `.yml` and `.yaml`, to what every workflow the harness ships
  # already meets: a workflow-level `defaults.run.shell: bash` (an un-shelled `producer | tee`
  # reports tee's status), a whole-number `timeout-minutes` on every job (none inherits
  # GitHub's 360), and harden-runner as each job's FIRST step, `egress-policy: audit` on
  # Windows. A finding names `<file>#<job>`. Ramped: an install whose baseVersion predates
  # 1.1.0 gets NOTEs until 1.2.0. No install: the check reads committed files only, which is
  # why the manifest is in the `paths:` lists above (graduating moves the verdict).
  workflow-hardening:
    name: workflow hardening (bash default, job ceilings, harden-runner first)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Every workflow meets the house rules
        run: node tools/check-workflow-hardening.mjs
