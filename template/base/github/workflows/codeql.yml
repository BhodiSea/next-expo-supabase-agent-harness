# CodeQL SAST — TypeScript/JavaScript app code AND the workflows themselves (the
# 'actions' language catches untrusted-input and injection bugs in CI). Diff-aware on
# PR, full nightly. The native halves are generated by
# prebuild (CNG) and never committed, so javascript-typescript covers the whole repo.
# Private repos need GitHub Advanced Security for SARIF upload; the analysis still runs.
# SOURCE: docs/harness/README.md (SAST layer)
name: codeql

on:
  pull_request:
  push:
    branches: ['{{DEFAULT_BRANCH}}']
  schedule:
    # Full nightly scan. 03:23 UTC.
    - cron: '23 3 * * *'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality = every security-extended query plus the reliability
          # and maintainability ones, so correctness bugs surface in the same tab.
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          category: '/language:${{ matrix.language }}'
