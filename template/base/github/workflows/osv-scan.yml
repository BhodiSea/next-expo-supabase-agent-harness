# OSV-Scanner SCA — known-vulnerability scan of the npm lockfile surface against
# the OSV database: every pnpm-lock.yaml the recursive scan discovers. (Cross-port
# note: the desktop sibling scanned a second ecosystem; this lineage is npm-only.)
# The PR job is diff-aware (fails only on NEWLY introduced vulns) — the
# deterministic form of a vulnerability gate: an unchanged tree can never red on
# an upstream advisory. The scheduled job scans the full tree DAILY and owns
# time-based discovery; Renovate owns the fix path. These are Google's official
# reusable workflows: pinned by full commit SHA with the version marker in the
# comment; Renovate keeps the pin current.
#
# DAILY SINCE 0.10.0, and the reason is a graded requirement rather than a taste:
# ASD Essential Eight PA-03 asks for a vulnerability scanner at least daily for
# online services, and the weekly cron this shipped with was a CADENCE GAP found
# by grading the register rather than by reading the file. The diff-aware PR half
# does not close it — a tree that has shipped a vulnerable pin since BEFORE the
# advisory never reds on a diff — so the full scan is what has to move.
# SOURCE: docs/harness/README.md (supply-chain scanning)
# SOURCE: tools/essential-eight.json (PA-02 / PA-03 / PA-05 — three claims on this lane)
name: osv-scan

on:
  pull_request:
  merge_group:
  push:
    branches: ['{{DEFAULT_BRANCH}}']
  schedule:
    # Daily full scan, 03:47 UTC. Off the hour on purpose: GitHub queues scheduled
    # workflows and the top of the hour is the most contended slot on the platform.
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-pr:
    name: osv (PR diff, npm)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9bb69575e74019c2ad085a1860787043adf47ccb # v2.2.4
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-full:
    name: osv (full tree, npm)
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9bb69575e74019c2ad085a1860787043adf47ccb # v2.2.4
    permissions:
      actions: read
      contents: read
      security-events: write

  # The CLOCKFUL half of the framework security floor (0.5.0). tools/framework-floor.json
  # is judged for CONTENT by chain step 11 (`version-sync`) — clockless, offline, on every
  # machine — and that half cannot ask the one question that matters most over time:
  # whether a human has re-read the upstream feed since. A floor left alone decays into an
  # assertion that no advisory has been published, and it decays silently.
  #
  # It is a JOB OF ITS OWN rather than a step inside scan-full because scan-full is a
  # reusable-workflow CALL (`uses:`), and a job with `uses:` may not carry `steps:`.
  #
  # schedule + workflow_dispatch ONLY, deliberately not `push` or `pull_request`: a lapsed
  # review is a maintenance signal, and a control that reds a contributor's unrelated PR
  # for a date is a control someone removes. It sits in osv-scan.yml because it is the same
  # concern on the same cadence — osv owns time-based DISCOVERY, this owns the review of
  # what discovery already found.
  floor-review:
    name: framework floor (review freshness)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      # No install: the check reads one JSON file and compares ISO dates. Keeping it
      # dependency-free is what lets it run weekly at no cost and never flake.
      - name: Every floored package carries an unlapsed review
        run: node tools/check-framework-floor.mjs

  # The BACKUP EVIDENCE lane (0.9.9). It sits here, beside floor-review, because it is the
  # same KIND of job rather than the same subject: scheduled-only, never a PR blocker, and
  # asking a question whose answer changes without anyone touching the repository.
  #
  # It is the one control in this harness whose subject is NOT in the tree. Backups live in
  # the platform's control plane, so the state can only be learned by asking over the network
  # — which is exactly why it may not ride `pnpm validate`, where a third party changing an
  # answer overnight would red an untouched commit. The JUDGEMENT is proven offline instead,
  # by tools/lib/backup-posture.mjs's unit tests over recorded API responses, so a lane that
  # skips for want of a token is still a lane that has been shown capable of going red.
  #
  # SKIPS LOUDLY without SUPABASE_ACCESS_TOKEN, and the skip says plainly that no backup
  # evidence is being produced — deliberately not a hard failure, because this job runs ON a
  # schedule (so CI is always true) and failing an operator who has not wired a token would
  # make deleting the job the rational response. An operator who HAS wired it sets
  # HARNESS_REQUIRE_BACKUP_EVIDENCE=1 to make the absence binding on themselves.
  backup-evidence:
    name: backups (recovery mechanism)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      # No install: one HTTPS GET and a pure judgement over the response.
      - name: The project reports a recovery mechanism
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node tools/check-backup-posture.mjs

  # The ASSET INVENTORY lane (0.10.0). Third of the same kind: scheduled-only, no PR
  # blocking, cheap enough to run on the daily cron.
  #
  # It is here rather than in its own workflow because asset discovery exists TO SUPPORT
  # vulnerability scanning — ASD's own wording for PA-01 — so the inventory and the scan
  # aimed at it belong on one lane and one clock. A separate nightly emitting an artefact
  # nothing consumes would be the decoration this job is written to avoid.
  #
  # THE JUDGEMENT IS THE POINT, NOT THE ARTEFACT. `pnpm sbom` is one line and cannot go
  # red; a lane that only emits is a green tick over an inventory that may have silently
  # lost half the tree. check-sbom.mjs closes the emission against pnpm-lock.yaml in BOTH
  # directions — a resolved package with no component, and a component no lockfile entry
  # resolves — and writes the artefact only after it has passed, so a broken inventory is
  # never the file a reader downloads six months later.
  #
  # NO INSTALL, like the two jobs above: `--lockfile-only` reads the lockfile and never the
  # store, so this needs no node_modules, no registry, and no cache. That is what makes a
  # DAILY inventory honest rather than aspirational.
  sbom-inventory:
    name: asset inventory (SBOM, closed against the lockfile)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Corepack for the pinned pnpm; no `cache: pnpm` and no install, because there is
      # nothing to restore — the whole lane reads two committed files.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Emit the inventory and prove it is the whole tree
        run: node tools/check-sbom.mjs --out=sbom.cdx.json

      # `if: always()` deliberately NOT set. A failed closure means the artefact does not
      # describe this tree, and publishing it anyway is how a wrong inventory outlives the
      # red run that found it.
      - name: Upload the inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
