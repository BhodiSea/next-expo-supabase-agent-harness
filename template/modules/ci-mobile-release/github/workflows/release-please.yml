# ci-mobile-release module — release automation. release-please maintains a running
# release PR from conventional commits; merging it bumps every version surface in
# lockstep (root + apps/web + apps/mobile package.json — the version-sync gate
# would fail anything less), tags vX.Y.Z, and creates the GitHub release that
# release-mobile.yml then builds and attaches store artifacts to. There is NO native
# config file in that list on purpose: app.config.ts DERIVES version, ios.buildNumber,
# android.versionCode and the runtimeVersion boundary from apps/mobile/package.json,
# and the version-sync gate recomputes the derivation on every run — the package.json
# bumps ARE the whole release surface (design record: PORT-SPEC, Versioning).
# Config: release-please-config.json + release-please-manifest.json (repo root).
# NOTE: a tag/release created with the default GITHUB_TOKEN does not trigger other
# workflows (recursion guard) — start release-mobile via workflow_dispatch on the tag,
# or push the tag manually. SOURCE: https://docs.github.com/en/actions/concepts/security/github_token
# SOURCE: docs/harness/gates-catalog.md (ci-mobile-release module)
name: release-please

on:
  push:
    branches: ['{{DEFAULT_BRANCH}}']

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # v5 pin resolved 2026-07-18 (design record: RELEASE-FACTS, release-please).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json
