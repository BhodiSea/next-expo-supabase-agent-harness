# gate-a11y-deep module — the NAMED deep-accessibility lane: the jest-expo sweep
# over the canonical route manifest (every reachable canonical data state ×
# accessible-name/labelled-input/visible-surface assertions). The suite already
# joins the base chain the moment the module is enabled (tools/check-e2e.mjs and
# the quality-gate unit/e2e-fast jobs run the whole RN suite); this workflow adds
# the named per-PR signal on mobile paths plus the nightly run, so a deep-sweep
# red is attributable at a glance instead of buried in a suite total.
# There is deliberately NO device-side ATF job here: the research verdict lives in
# docs/modules/gate-a11y-deep/README.md, and the judgement half is the manual
# docs/runbooks/screen-reader-checklist.md pass — machine checks stop where
# judgement starts.
# SOURCE: docs/harness/gates-catalog.md (opt-in modules — gate-a11y-deep)
name: a11y-deep

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  schedule:
    # Nightly full sweep. 04:37 UTC — offset from quality-gate's 03:11 nightly
    # AND from device-e2e's 04:23 (strict tier installs both; same-minute
    # nightlies pile onto the runner-concurrency budget together).
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11y-deep-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` step under bash -eo pipefail. A step that names no shell runs as `bash -e`,
# WITHOUT pipefail, so `producer | tee file` reports tee's status and the producer's
# failure is swallowed. Selecting the shell here closes that for the whole workflow.
defaults:
  run:
    shell: bash

jobs:
  a11y-deep:
    name: deep a11y sweep (route manifest x states x accessible names)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack (pins pnpm from package.json#packageManager)
        run: corepack enable

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The sweep names its offenders (element#testID [role=…]) — a red here is
      # debuggable from the log alone, no artifact needed.
      - name: Deep a11y sweep (jest-expo, manifest-keyed)
        run: pnpm --filter mobile exec jest --silent __tests__/a11y-deep.test.tsx
