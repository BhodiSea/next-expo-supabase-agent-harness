# eas-update module — the dispatch-only OTA publish path. An operator picks a
# channel and writes an audit message; the run re-proves the harness floor
# (node tools/validate.mjs --min-floor) plus this module's own sanity gate, then
# publishes with `eas update --channel <ch> --non-interactive` (the command runs
# `expo export` on the runner, uploads the bundle, and EAS serves it to matching
# binaries).
# HONEST DEGRADE: without an EXPO_TOKEN secret the run still exports the update
# bundle credential-free and uploads it beside a NOT-PUBLISHED.txt marker with a
# workflow warning — never a silent green, never a hard requirement.
# ROLLBACK DOCTRINE: there is deliberately NO rollback input and no rollback
# verb here — a rollback is a republish of known-good code through this same
# reviewed path (see docs/modules/eas-update/README.md).
# SOURCE: docs/harness/gates-catalog.md (eas-update module); eas update flags
# verified against eas-cli v21 in the design record (RELEASE-FACTS).
name: eas-update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel to publish to'
        required: true
        type: choice
        # Mirror of the channels the module README wires into eas.json build
        # profiles — extend BOTH together. A choice input (never free text) so
        # a typo cannot mint a fresh channel no shipped binary ever polls.
        options:
          - preview
          - production
      message:
        description: 'Update message (the audit line in the EAS dashboard)'
        required: true
        type: string
      rollout-percentage:
        description: 'Staged rollout: percent of clients reached immediately (1-100; empty = all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  # Never cancel a publish mid-flight; queue instead.
  cancel-in-progress: false

env:
  # renovate: datasource=npm depName=eas-cli
  EAS_CLI_VERSION: '21.0.2'

jobs:
  publish:
    name: validate, then publish (or degrade loudly)
    runs-on: ubuntu-latest
    # Same convention as the release pipeline: publishes run in the `release`
    # environment (auto-created unprotected on first dispatch) so EXPO_TOKEN can
    # be environment-scoped and the environment protected with required
    # reviewers once publishes need sign-off.
    environment: release
    timeout-minutes: 45
    env:
      # Secrets cannot be referenced in step `if:` directly — surface presence as env.
      HAVE_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Reject a malformed rollout percentage before spending a validate run
        shell: bash
        env:
          ROLLOUT: ${{ inputs.rollout-percentage }}
        run: |
          set -euo pipefail
          if [ -n "$ROLLOUT" ]; then
            if ! [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
              echo "::error::rollout-percentage must be an integer 1-100 (got '$ROLLOUT')"
              exit 1
            fi
          fi

      - name: Enable Corepack (pins pnpm from package.json#packageManager)
        run: corepack enable

      # No dependency cache on the publish path (same cache-poisoning rule as
      # the release workflows): what ships to every installed client must not
      # be assembled from a cache — a publish pays full install price.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The harness's own definition of green, hardcoded-floor merged in — a
      # red tree cannot be published over the air any more than it can merge.
      - name: Validate (min floor, toolchains required)
        env:
          HARNESS_REQUIRE_TOOLCHAINS: '1'
        run: node tools/validate.mjs --min-floor

      # Explicit even when the consumer wired it into VALIDATE_STEPS: a consumer
      # who skipped the wiring still cannot publish past a broken OTA surface.
      # CI=true makes its skips fail closed here.
      - name: OTA surface sanity (module gate)
        run: node tools/check-eas-update.mjs

      # `--json` implies non-interactive (eas-cli's own flag description); the
      # flag stays for greppable intent. Under the hood `eas update` runs
      # `expo export` here on the runner and uploads the bundle; EAS serves it
      # to binaries matching platform, runtime version (== app version under
      # the locked policy), and channel.
      # SOURCE: docs/modules/eas-update/README.md; https://docs.expo.dev/eas-update/getting-started/
      - name: Publish the update (eas update)
        if: env.HAVE_TOKEN == 'true'
        shell: bash
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
          ROLLOUT: ${{ inputs.rollout-percentage }}
        run: |
          set -euo pipefail
          args=(update --channel "$CHANNEL" --message "$MESSAGE" --non-interactive --json)
          if [ -n "$ROLLOUT" ]; then
            args+=("--rollout-percentage=$ROLLOUT")
          fi
          npx --yes "eas-cli@${EAS_CLI_VERSION}" "${args[@]}" | tee ../../eas-update-receipt.json

      - name: Degrade loudly (no EXPO_TOKEN — export only, publish nothing)
        if: env.HAVE_TOKEN != 'true'
        shell: bash
        working-directory: apps/mobile
        env:
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          echo "::warning::EXPO_TOKEN is not configured — NOTHING WAS PUBLISHED. The exported bundle in the run artifact is for inspection only."
          npx expo export --platform all
          {
            echo "This run published NOTHING: the EXPO_TOKEN secret is not configured."
            echo "Requested channel: $CHANNEL"
            echo "Requested message: $MESSAGE"
            echo "Commit: $GITHUB_SHA"
            echo "The dist/ export beside this file is the update that WOULD have shipped."
            echo "Configure EXPO_TOKEN (a robot access token) and re-dispatch to publish for real."
          } > dist/NOT-PUBLISHED.txt
          cat dist/NOT-PUBLISHED.txt

      # Receipt (published path) or NOT-PUBLISHED marker + export metadata
      # (degraded path) — one of them must exist, so an empty upload is a red.
      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eas-update-evidence
          path: |
            eas-update-receipt.json
            apps/mobile/dist/NOT-PUBLISHED.txt
            apps/mobile/dist/metadata.json
          retention-days: 90
          if-no-files-found: error
