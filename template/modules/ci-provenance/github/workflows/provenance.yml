# ci-provenance module — SLSA Build L2 provenance + an npm-ecosystem SBOM.
# GitHub OIDC only (no long-lived keys):
#   - `npm pack` every workspace package + the server, attest each tarball, syft SBOM
#   - one SBOM ecosystem is the WHOLE production surface here: native platform
#     dependencies enter this stack through npm packages (Expo modules, config
#     plugins, autolinking), so the pnpm tree covers what ships
#   - NOTICES drift: tools/check-notices.mjs regenerates the third-party notice
#     file from the live dependency set and fails on drift vs the committed one
#   - verify: `gh attestation verify` runs IN CI — producing an attestation nobody
#     checks is theater.
# The store binaries (.aab/.ipa) never pass through this job — EAS builds them
# off-runner. If your consumers verify the store binaries rather than the packages,
# extend the verify-and-attach job in release-mobile.yml (ci-mobile-release) with
# the same attest/verify pair (see docs/modules/ci-provenance/README.md, "Honest limits").
# Honest limit: a valid attestation proves BUILD-PATH integrity, not SOURCE
# integrity — a stolen OIDC token mints cryptographically valid attestations. For
# Build L3, move the build into an isolated reusable workflow (slsa-github-generator).
# SOURCE: docs/harness/gates-catalog.md (ci-provenance module)
name: provenance

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> Fulcio short-lived signing cert (Sigstore, logged to Rekor)
  attestations: write

concurrency:
  group: provenance-${{ github.ref }}
  # Never cancel a release attestation mid-flight; queue instead.
  cancel-in-progress: false

# Every `run:` step under bash -eo pipefail. A step that names no shell runs as `bash -e`,
# WITHOUT pipefail, so `producer | tee file` reports tee's status and the producer's
# failure is swallowed. Selecting the shell here closes that for the whole workflow.
defaults:
  run:
    shell: bash

jobs:
  attest:
    name: attest npm packages + SBOM + NOTICES drift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      # cache-poisoning is suppressed for this file in .github/zizmor.yml: no dependency
      # cache is configured and the workflow is tag-triggered only (not reachable from PRs).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: NOTICES drift check (third-party attributions vs live dependency set)
        run: node tools/check-notices.mjs

      # apps/mobile is deliberately NOT packed: its shipped artifact is the store
      # binary (.aab/.ipa), EAS-built off-runner — attest it where it is verified
      # (ci-mobile-release's verify-and-attach job; see the module README).
      - name: Pack workspace packages (npm pack per package)
        shell: bash
        run: |
          mkdir -p dist-pack
          pnpm --filter './packages/*' --filter './apps/web' exec \
            npm pack --pack-destination "$GITHUB_WORKSPACE/dist-pack"
          ls -l dist-pack/

      - name: Attest build provenance (SLSA Build L2, every tarball)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-pack/*.tgz

      - name: SBOM — npm ecosystem (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist-pack/sbom-npm.spdx.json

      - name: Upload packages + SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-bundle
          path: dist-pack/
          if-no-files-found: error

      # Prove the attestations are verifiable IN CI — the release gates on it. The
      # attestation can lag a few seconds after attest-*, so retry briefly; the final
      # attempt's exit code is the gate.
      - name: Verify attestations (in-CI gate)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          for tarball in dist-pack/*.tgz; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$tarball" -R "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "attestation for $tarball not yet queryable (attempt $attempt/5) — retrying in 10s"
              sleep 10
            done
            if [ "$verified" != 'true' ]; then
              echo "::error::attestation for $tarball failed to verify after retries"
              status=1
            fi
          done
          exit "$status"

# Verify locally with the GitHub CLI:
#   gh attestation verify dist-pack/<package>.tgz -R <org>/<repo>
