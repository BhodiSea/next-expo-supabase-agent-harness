# maestro/journeys/mutation.yaml — the on-device MUTATION flow: sign in through the
# app's own screen, create a note through the real composer, relaunch, and prove the
# note SURVIVED. This is the one device flow that exercises the full stack — the
# Supabase session, the tRPC client path, Postgres under FORCE RLS — where every sweep
# flow tolerates the signed-out error states.
#
# PRECONDITIONS (the workflow's job): the DEV build is installed, Metro serves the
# bundle, the API server + Supabase stack are up with `adb reverse` mapping the app's
# 127.0.0.1 ports to the runner, and the identity this journey signs in as EXISTS with
# a personal org — minted by scripts/ci/mint-device-user.mjs (admin createUser +
# ensure_personal_org as that user, the tests/rls/db-context.ts precedent) and handed
# in as the Maestro flow variables DEVICE_EMAIL / DEVICE_PASSWORD
# (`check-e2e-device.mjs --env`). clearState makes the sign-in deterministic.
#
# 1.0.0 CORRECTION: this journey used to tap an EMPTY sign-in form and expect the
# inherited harness's __DEV__ stub authority to mint a user. Supabase Auth replaced
# that authority, the form became a real email/password sign-in, and every nightly
# device lane since stopped here at "Enter an email address." — invisible at agent
# time because the journey runs only on the emulator. The sign-in is real now, so
# what follows (create → relaunch → persists) is finally proven against the actual
# session, tRPC path and FORCE RLS it was written to exercise.
#
# The persistence assertion is the RELAUNCH half: stopApp drops every in-memory cache,
# so the second `note-row` sighting can only come from the server round-trip with the
# keychain-persisted token — exactly the two seams a mocked lane cannot see.
appId: {{APP_IDENTIFIER}}
---
- launchApp:
    clearState: true
# The app must be INTERACTIVE before the deep link fires: after clearState the
# dev build re-fetches its bundle from Metro, and a VIEW intent delivered while
# the router is still mounting is dropped on the floor — the first emulator
# dispatch proved it (tabs mounted signed-out, sign-in never appeared, 60s
# timeout). open-actions is the home header leaf that exists in every data
# state, signed-out included — it appearing IS "the router is live".
- extendedWaitUntil:
    visible:
        id: "open-actions"
    timeout: 90000
- openLink: "{{APP_SCHEME}}://sign-in"
- extendedWaitUntil:
    visible:
        id: "sign-in-submit"
    timeout: 60000
# The real form: the minted identity's credentials, typed into the real fields, the
# real submit handler run — a planted session would prove the server reads a token
# and nothing about what the app writes (the web e2e's rule, applied on device).
- tapOn:
    id: "sign-in-email"
- inputText: ${DEVICE_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${DEVICE_PASSWORD}
# Enter, NOT hideKeyboard: Maestro's Android hideKeyboard is `input keyevent 4` —
# BACK — and when no IME is up (UiAutomator typed the text without one) that key
# reaches NAVIGATION and pops sign-in back to Home, which is exactly what the
# second 1.0.0 dispatch showed (submit "not found"; hierarchy = Home, "You are
# not signed in."). Enter on the focused single-line password field submits the
# edit and blurs it — the IME closes if it was open, and nothing navigates — so
# the submit button below the fields is on screen for the tap.
- pressKey: Enter
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible:
        id: "home-screen"
    timeout: 60000
- tapOn:
    id: "note-composer-input"
- inputText: "Device mutation flow note"
- tapOn:
    id: "note-composer-submit"
# note-row (not note-row-pending): the row only sheds its pending testID once the
# server confirmed the create — the optimistic echo alone cannot green this.
- extendedWaitUntil:
    visible:
        id: "note-row"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
        id: "note-row"
    timeout: 60000
